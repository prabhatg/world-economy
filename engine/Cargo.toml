[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but oikos-py, which links against Python and is built by maturin (see
# scripts/check.sh). Add new crates here too, so `cargo test` and the wasm build see them.
default-members = [
  "crates/oikos-cli",
  "crates/oikos-core",
  "crates/oikos-grid",
  "crates/oikos-io",
  "crates/oikos-math",
  "crates/oikos-params",
  "crates/oikos-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/prabhatg/world-economy"
rust-version = "1.85"

[workspace.dependencies]
oikos-core = { path = "crates/oikos-core" }
oikos-math = { path = "crates/oikos-math" }
oikos-grid = { path = "crates/oikos-grid" }
oikos-sim = { path = "crates/oikos-sim" }
oikos-params = { path = "crates/oikos-params" }
oikos-io = { path = "crates/oikos-io" }
h3o = "0.11"
blake3 = "1.8"
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.12"
flate2 = "1.1"
parquet = { version = "60", default-features = false, features = ["snap"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
proptest = { version = "1.12", default-features = false, features = ["std", "bit-set"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
