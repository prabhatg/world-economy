# Parameter registry for the engine's mechanisms: the M0 toy mechanisms (growth, band
# fission, migration) and, from M1, foraging carrying capacity from forcing packs,
# forager dispersal, and cultivation and domestication.
#
# Every parameter declares its unit, valid range, calibration prior, status and
# sources. Status "placeholder" means an engine-test value with no empirical claim;
# M1 replaces these with literature-based or calibrated values.
# Status "calibrated" means the value of one world consistent with the M1 record
# (calibration/runs/m1/round7/best.json, ADR-0065); its note gives the consistent range.
#
# Changing a default changes the golden hash (engine/golden/m0-toy.json).

name = "m0-toy"
version = 4

[params.period_ticks]
group = "time"
unit = "days"
description = "Period of the growth and fission mechanisms."
kind = { type = "integer", min = 1, max = 3650 }
default = 365
prior = { dist = "fixed" }
status = "placeholder"
note = "Yearly steps suit slow prehistoric dynamics; finer periods arrive with seasonal mechanisms in M1."

[params.growth_rate]
group = "demography"
unit = "1/period"
description = "Intrinsic growth rate r in logistic growth dw = r w (1 - N/K) of mobile foragers (see sedentary_growth_rate)."
kind = { type = "real", min = 0.0, max = 0.1 }
default = 0.003274
prior = { dist = "uniform", lo = 0.001, hi = 0.03 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0037 to 0.027 (10-90%). Local growth of foragers between filling empty land and holding at capacity; the Neolithic demographic transition is sedentary_growth_rate."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Bocquet-Appel, J.-P. (2011). When the world's population took off: the springboard of the Neolithic Demographic Transition. Science 333, 560-561.", doi = "10.1126/science.1208880" },
]

[params.sedentary_growth_rate]
group = "demography"
unit = "1/period"
description = "Intrinsic growth rate of fully sedentary cultivators; a band's rate moves linearly from growth_rate (mobile foragers) to this with its cultivation effort (the Neolithic demographic transition)."
kind = { type = "real", min = 0.0, max = 0.1 }
default = 0.00934
prior = { dist = "uniform", lo = 0.001, hi = 0.03 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0037 to 0.026 (10-90%). Sedentism and cereal weaning foods shorten birth intervals: fertility rises with dependence on cultivation, followed by higher child mortality, with net growth higher than foragers'. The record does not identify the ratio to growth_rate (open question Q27); the calibrated world has one, at 2.7 times the forager rate."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Bocquet-Appel, J.-P. (2002). Paleoanthropological traces of a Neolithic demographic transition. Current Anthropology 43, 637-650.", doi = "10.1086/342429" },
  { citation = "Bocquet-Appel, J.-P. (2011). When the world's population took off: the springboard of the Neolithic Demographic Transition. Science 333, 560-561.", doi = "10.1126/science.1208880" },
  { citation = "Sellen, D.W., Mace, R. (1997). Fertility and mode of subsistence: a phylogenetic analysis. Current Anthropology 38, 878-889.", doi = "10.1086/204677" },
  { citation = "Page, A.E. et al. (2016). Reproductive trade-offs in extant hunter-gatherers suggest adaptive mechanism for the Neolithic expansion. PNAS 113, 4694-4699.", doi = "10.1073/pnas.1524031113" },
]

[params.capacity_min]
group = "environment"
unit = "people per cell"
description = "Lower bound of the toy carrying capacity drawn per cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 20
prior = { dist = "fixed" }
status = "placeholder"
note = "Toy environment; M1 derives carrying capacity from climate, soils and biomes."

[params.capacity_max]
group = "environment"
unit = "people per cell"
description = "Upper bound of the toy carrying capacity drawn per cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 400
prior = { dist = "fixed" }
status = "placeholder"
note = "Toy environment; M1 derives carrying capacity from climate, soils and biomes."

[params.fission_threshold]
group = "social"
unit = "people"
description = "Bands at least this large may split."
kind = { type = "integer", min = 2, max = 10000 }
default = 60
prior = { dist = "uniform", lo = 30.0, hi = 150.0 }
status = "placeholder"
note = "About twice a typical forager residential group size; scalar-stress fission theory to be added in M1."
sources = [
  { citation = "Marlowe, F. W. (2005). Hunter-gatherers and human evolution. Evolutionary Anthropology 14, 54-67.", doi = "10.1002/evan.20046" },
]

[params.fission_probability]
group = "social"
unit = "probability per period"
description = "Probability that an eligible band splits in one period."
kind = { type = "probability" }
default = 0.2
prior = { dist = "uniform", lo = 0.05, hi = 0.5 }
status = "placeholder"
note = "Engine-test value."

[params.exploration_probability]
group = "migration"
unit = "probability"
description = "Probability that a daughter band moves to a random neighbor instead of the least crowded one."
kind = { type = "probability" }
default = 0.3
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "placeholder"
note = "Engine-test value."

[params.merge_threshold]
group = "resolution"
unit = "people"
description = "Agents smaller than this merge with other small agents in their cell (super-individual resolution control)."
kind = { type = "integer", min = 0, max = 1000 }
default = 10
prior = { dist = "fixed" }
status = "placeholder"
note = "Numerical resolution setting, not a behavioral claim."

[params.initial_bands]
group = "initial"
unit = "bands"
description = "Number of bands placed around the seed-chosen start cell (worlds without a climate pack, or with initial_occupancy 0)."
kind = { type = "integer", min = 1, max = 100000 }
default = 12
prior = { dist = "fixed" }
status = "placeholder"
note = "Engine-test value; M1 starts from reconstructed late-Pleistocene population estimates."

[params.initial_weight]
group = "initial"
unit = "people"
description = "People per initial band."
kind = { type = "integer", min = 1, max = 1000 }
default = 30
prior = { dist = "fixed" }
status = "placeholder"
note = "Close to typical forager residential group sizes."
sources = [
  { citation = "Marlowe, F. W. (2005). Hunter-gatherers and human evolution. Evolutionary Anthropology 14, 54-67.", doi = "10.1002/evan.20046" },
]

[params.initial_occupancy]
group = "initial"
unit = "N/K"
description = "Worlds with a climate pack start with one forager band in every habitable cell at this share of its forager capacity (0: start from initial_bands instead)."
kind = { type = "probability" }
default = 0.5
prior = { dist = "uniform", lo = 0.2, hi = 1.0 }
status = "placeholder"
note = "Epipaleolithic foragers (Kebaran, Natufian, Zarzian) lived across Southwest Asia by 12,000 BCE; how close to capacity is uncertain and calibrated."
sources = [
  { citation = "Bar-Yosef, O. (1998). The Natufian culture in the Levant, threshold to the origins of agriculture. Evolutionary Anthropology 6, 159-177.", doi = "10.1002/(SICI)1520-6505(1998)6:5<159::AID-EVAN4>3.0.CO;2-7" },
]

# Forager dispersal (ADR-0048): bands in crowded cells bud off into less crowded
# neighbors, the wave of advance by which foragers fill a landscape.

[params.dispersal_crowding]
group = "migration"
unit = "N/K"
description = "Bands disperse only from cells at least this crowded (population over carrying capacity)."
kind = { type = "real", min = 0.0, max = 2.0 }
default = 0.8086
prior = { dist = "uniform", lo = 0.5, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.56 to 0.93 (10-90%). Foragers move before resources are exhausted; the threshold is calibrated against dispersal speed."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.dispersal_probability]
group = "migration"
unit = "probability per period"
description = "Probability that a band in a crowded cell sends a group to a less crowded neighbor in one period."
kind = { type = "probability" }
default = 0.4674
prior = { dist = "log_uniform", lo = 0.01, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.015 to 0.31 (10-90%). Sets the diffusion rate of the wave of advance (speed ~ 2 sqrt(r D)); calibrated against dated expansion fronts."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Ammerman, A.J., Cavalli-Sforza, L.L. (1984). The Neolithic Transition and the Genetics of Populations in Europe. Princeton University Press.", doi = "10.1515/9781400853113" },
]

[params.dispersal_fraction]
group = "migration"
unit = "1"
description = "Share of a dispersing band that leaves (the rest stays)."
kind = { type = "probability" }
default = 0.5
prior = { dist = "uniform", lo = 0.2, hi = 0.8 }
status = "placeholder"
note = "Budding: part of a group founds a new territory while the rest keeps the old one."

# Foraging carrying capacity (ADR-0047): used by worlds with a climate pack; toy worlds
# keep capacity_min/capacity_max.

[params.capacity_period_ticks]
group = "time"
unit = "days"
description = "How often carrying capacity is recomputed from the climate (which changes over centuries)."
kind = { type = "integer", min = 1, max = 36500 }
default = 3650
prior = { dist = "fixed" }
status = "placeholder"
note = "Ten years: well below the 100-year climate slices, and cheap enough to leave the step cost unchanged."

[params.miami_npp_max]
group = "foraging"
unit = "g dry matter m-2 yr-1"
description = "Miami model: asymptotic net primary productivity of the temperature and precipitation limits."
kind = { type = "real", min = 1.0, max = 10000.0 }
default = 3000.0
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_temp_offset]
group = "foraging"
unit = "1"
description = "Miami model temperature limit: NPP_T = max / (1 + exp(offset - slope T))."
kind = { type = "real", min = -10.0, max = 10.0 }
default = 1.315
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_temp_slope]
group = "foraging"
unit = "1/degC"
description = "Miami model temperature limit: slope on annual mean temperature."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.119
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_precip_slope]
group = "foraging"
unit = "1/mm"
description = "Miami model precipitation limit: NPP_P = max (1 - exp(-slope P)), P in mm per year."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.000664
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.npp_reference]
group = "foraging"
unit = "g dry matter m-2 yr-1"
description = "Productivity at which foragers live at forager_density_ref."
kind = { type = "real", min = 1.0, max = 5000.0 }
default = 1000.0
prior = { dist = "fixed" }
status = "placeholder"
note = "A normalizing constant (temperate woodland productivity); calibration moves forager_density_ref instead."

[params.forager_density_ref]
group = "foraging"
unit = "people/km2"
description = "Forager population density at the reference productivity, without aquatic resources."
kind = { type = "real", min = 0.001, max = 5.0 }
default = 0.09515
prior = { dist = "log_uniform", lo = 0.02, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.031 to 0.39 (10-90%). Ethnographic terrestrial forager densities mostly fall between ~0.01 and ~1 person/km2; calibrated against radiocarbon density."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.npp_elasticity]
group = "foraging"
unit = "1"
description = "Elasticity of forager density with respect to net primary productivity: density = ref (NPP / NPP_ref)^elasticity."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 0.5117
prior = { dist = "uniform", lo = 0.5, hi = 1.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.59 to 1.4 (10-90%). Forager density rises with productivity across ethnographic groups; the exponent is uncertain and calibrated."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Tallavaara, M., Eronen, J.T., Luoto, M. (2018). Productivity, biodiversity, and pathogens influence the global hunter-gatherer population density. PNAS 115, 1232-1237.", doi = "10.1073/pnas.1715638115" },
]

[params.aquatic_bonus]
group = "foraging"
unit = "1"
description = "Forager density added where a perennial river, a lake shore or a sea coast is at hand, as a multiple of forager_density_ref (independent of local productivity)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.5
prior = { dist = "uniform", lo = 0.0, hi = 1.5 }
status = "placeholder"
note = "Foragers with aquatic resources reach higher densities, also in deserts (the Nile valley); magnitude to be calibrated."
sources = [
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
]

[params.perennial_discharge]
group = "foraging"
unit = "m3/s"
description = "Least long-term mean discharge for a river to count as a perennial aquatic resource."
kind = { type = "real", min = 0.0, max = 1000.0 }
default = 1.0
prior = { dist = "fixed" }
status = "placeholder"
note = "Matches the hydrology pack's threshold for river_length (wadis excluded)."

# Cultivation and domestication (ADR-0049): bands shift effort into cultivating wild
# cereals, driven by population pressure, climate stress or abundance (competing
# hypotheses nested as weights: set the others to zero to run one alone); cultivation
# selects for domestic traits, slowly or quickly (competing hypotheses as the range of
# selection_coefficient); domestic crops raise carrying capacity. Used by worlds with a
# climate pack; toy worlds never cultivate.

[params.cultivation_crowding]
group = "cultivation"
unit = "N/K"
description = "Population pressure is the crowding (people over forager capacity) beyond this value, capped at 1."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 1.2
prior = { dist = "uniform", lo = 0.9, hi = 1.5 }
status = "placeholder"
note = "Above 1, foragers at equilibrium feel no pressure, and moving away absorbs small local overshoots; pressure comes when the climate cuts forager capacity or cultivation lets people outgrow it. Since any cultivation raises capacity, pressure then ratchets effort up (Rindos 1984)."
sources = [
  { citation = "Cohen, M.N. (1977). The Food Crisis in Prehistory: Overpopulation and the Origins of Agriculture. Yale University Press." },
]

[params.cultivation_pressure_weight]
group = "cultivation"
unit = "1"
description = "Population-pressure hypothesis: target cultivation effort per unit of pressure (crowding beyond cultivation_crowding, capped at 1)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.3465
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.04 to 0.59 (10-90%). Zero switches the hypothesis off; calibration weighs it against stress and abundance."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Binford, L.R. (1968). Post-Pleistocene adaptations. In Binford, S.R., Binford, L.R. (eds), New Perspectives in Archeology, 313-341. Aldine." },
  { citation = "Cohen, M.N. (1977). The Food Crisis in Prehistory: Overpopulation and the Origins of Agriculture. Yale University Press." },
]

[params.cultivation_stress_weight]
group = "cultivation"
unit = "1"
description = "Climate-stress hypothesis: target cultivation effort per unit of climate stress (the relative decline of forager capacity over stress_window_years)."
kind = { type = "real", min = 0.0, max = 10.0 }
default = 1.0
prior = { dist = "uniform", lo = 0.0, hi = 3.0 }
status = "placeholder"
note = "The Younger Dryas cut forager capacity by tens of percent; zero switches the hypothesis off."
sources = [
  { citation = "Moore, A.M.T., Hillman, G.C. (1992). The Pleistocene to Holocene transition and human economy in Southwest Asia: the impact of the Younger Dryas. American Antiquity 57, 482-494.", doi = "10.2307/280936" },
  { citation = "Bar-Yosef, O. (1998). The Natufian culture in the Levant, threshold to the origins of agriculture. Evolutionary Anthropology 6, 159-177.", doi = "10.1002/(SICI)1520-6505(1998)6:5<159::AID-EVAN4>3.0.CO;2-7" },
]

[params.cultivation_abundance_weight]
group = "cultivation"
unit = "1"
description = "Abundance (niche-construction) hypothesis: target cultivation effort per unit of wild-cereal suitability, at any population density."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.3931
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.11 to 0.73 (10-90%). Rich wild stands invite tending and sowing without stress."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Smith, B.D. (2007). Niche construction and the behavioral context of plant and animal domestication. Evolutionary Anthropology 16, 188-199.", doi = "10.1002/evan.20135" },
  { citation = "Zeder, M.A. (2016). Domestication as a model system for niche construction theory. Evolutionary Ecology 30, 325-348.", doi = "10.1007/s10682-015-9801-8" },
]

[params.cultivation_variability_weight]
group = "cultivation"
unit = "1/suitability per century"
description = "Stable-climate hypothesis: cultivation targets are multiplied by 1 - weight x climate variability (the mean change of wild-cereal suitability per century over the stress window), at least 0."
kind = { type = "real", min = 0.0, max = 50.0 }
default = 14.22
prior = { dist = "uniform", lo = 0.0, hi = 20.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 4.2 to 18 (10-90%). Zero switches the hypothesis off. Late-glacial climates swung too fast for sowing to pay; the Holocene made it possible. In the M1 forcing suitability changes about 0.08 per century before 9,000 BCE and 0.03 after."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Richerson, P.J., Boyd, R., Bettinger, R.L. (2001). Was agriculture impossible during the Pleistocene but mandatory during the Holocene? A climate change hypothesis. American Antiquity 66, 387-411.", doi = "10.2307/2694241" },
  { citation = "Bettinger, R., Richerson, P., Boyd, R. (2009). Constraints on the development of agriculture. Current Anthropology 50, 627-631.", doi = "10.1086/605359" },
]

[params.stress_window_years]
group = "cultivation"
unit = "years"
description = "Climate stress compares forager capacity now with this many years earlier."
kind = { type = "integer", min = 10, max = 2000 }
default = 300
prior = { dist = "uniform", lo = 100.0, hi = 1000.0 }
status = "placeholder"
note = "Memory of better times over about ten generations; climate slices are a century apart."

[params.adoption_rate]
group = "cultivation"
unit = "1/period"
description = "Share of the gap between a band's cultivation effort and its target closed each period (social learning)."
kind = { type = "probability" }
default = 0.017
prior = { dist = "log_uniform", lo = 0.005, hi = 0.2 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0086 to 0.15 (10-90%). The rate at which a band learns when everyone around it plants; with innovation_share small it learns slowly while few do, so practices spread over generations."
sources = [
  { citation = "Henrich, J. (2001). Cultural transmission and the diffusion of innovations: adoption dynamics indicate that biased cultural transmission is the predominate force in behavioral change. American Anthropologist 103, 992-1013.", doi = "10.1525/aa.2001.103.4.992" },
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
]

[params.innovation_share]
group = "cultivation"
unit = "1"
description = "Share of a band's learning of cultivation that is its own (innovation), the rest learned from the people around it: the gap to the target closes at adoption_rate * (i + (1 - i) * seen), seen being the mean cultivation effort of the people in its cell."
kind = { type = "probability" }
default = 0.003682
prior = { dist = "log_uniform", lo = 0.00001, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 5.1e-05 to 0.43 (10-90%). 1 switches the hypothesis off (individual learning, the model before ADR-0065). Small shares make cultivation an innovation few have seen, which spreads slowly at first and then fast, an S-shaped adoption curve: Henrich (2001) reads such curves as the mark of biased cultural transmission, and Bass (1969) fits them as innovation plus imitation."
sources = [
  { citation = "Bass, F.M. (1969). A new product growth for model consumer durables. Management Science 15, 215-227.", doi = "10.1287/mnsc.15.5.215" },
  { citation = "Henrich, J. (2001). Cultural transmission and the diffusion of innovations: adoption dynamics indicate that biased cultural transmission is the predominate force in behavioral change. American Anthropologist 103, 992-1013.", doi = "10.1525/aa.2001.103.4.992" },
  { citation = "Ackland, G.J., Signitzer, M., Stratford, K., Cohen, M.H. (2007). Cultural hitchhiking on the wave of advance of beneficial technologies. PNAS 104, 8714-8719.", doi = "10.1073/pnas.0702469104" },
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
]

[params.selection_coefficient]
group = "cultivation"
unit = "1/period"
description = "Selection for domestic traits (e.g. non-shattering ears) under full cultivation effort, per crop generation (one per year)."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.003333
prior = { dist = "log_uniform", lo = 0.001, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0027 to 0.0091 (10-90%). The prior spans the competing hypotheses: protracted domestication (s ~ 0.001-0.01 from the archaeobotanical record) and rapid domestication (s ~ 0.05-0.5 under sickle harvest and resowing in experiments)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Purugganan, M.D., Fuller, D.Q. (2011). Archaeological data reveal slow rates of evolution during plant domestication. Evolution 65, 171-183.", doi = "10.1111/j.1558-5646.2010.01093.x" },
  { citation = "Hillman, G.C., Davies, M.S. (1990). Measured domestication rates in wild wheats and barley under primitive cultivation, and their archaeological implications. Journal of World Prehistory 4, 157-222.", doi = "10.1007/BF00974763" },
]

[params.domestic_wild_frequency]
group = "cultivation"
unit = "1"
description = "Share of domestic-type plants in wild stands (the floor selection acts on)."
kind = { type = "probability" }
default = 0.0003471
prior = { dist = "log_uniform", lo = 0.00001, hi = 0.01 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 1.7e-05 to 0.0049 (10-90%). Tough-rachis mutants are rare in wild stands; the order of magnitude is uncertain."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Hillman, G.C., Davies, M.S. (1990). Measured domestication rates in wild wheats and barley under primitive cultivation, and their archaeological implications. Journal of World Prehistory 4, 157-222.", doi = "10.1007/BF00974763" },
]

[params.introgression_rate]
group = "cultivation"
unit = "1/period"
description = "Pull of a band's crop back toward the wild type, per unit of effort not spent cultivating (gene flow from wild stands, abandoned fields)."
kind = { type = "probability" }
default = 0.0001889
prior = { dist = "log_uniform", lo = 0.0001, hi = 0.01 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 1.2e-04 to 0.0016 (10-90%). Gene flow from wild populations is why the protracted model predicts slow domestication; with it, light cultivation never domesticates."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Allaby, R.G., Fuller, D.Q., Brown, T.A. (2008). The genetic expectations of a protracted model for the origins of domesticated crops. PNAS 105, 13982-13986.", doi = "10.1073/pnas.0803780105" },
]

[params.farm_density]
group = "cultivation"
unit = "people/km2"
description = "People fed per km2 of dry land under full cultivation of domestic crops where wild cereals grow best."
kind = { type = "real", min = 0.01, max = 100.0 }
default = 4.656
prior = { dist = "log_uniform", lo = 0.5, hi = 10.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.66 to 7.2 (10-90%). Regional densities of early farmers were around one to a few people per km2, an order of magnitude above foragers."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
