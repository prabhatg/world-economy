]

[params.soil_erosion_rate]
group = "cultivation"
unit = "soil share per year at full effort"
description = "Land-degradation hypothesis: share of a cell's erodible soil lost per year under full cultivation effort (in proportion to effort)."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.00004078
prior = { dist = "uniform", lo = 0.0, hi = 0.001 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 2.6e-05 to 7.3e-04 (10-90%). Zero switches the hypothesis off. Tilled land erodes one to two orders of magnitude faster than soil forms (about 1 mm/yr against 0.01-0.1 mm/yr); hoe and sickle farming of thin Mediterranean soils loses tens of centimetres over millennia: 1e-4 to 1e-3 of the erodible depth per year."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Montgomery, D.R. (2007). Soil erosion and agricultural sustainability. PNAS 104, 13268-13272.", doi = "10.1073/pnas.0611508104" },
  { citation = "Rollefson, G.O., Kohler-Rollefson, I. (1989). The collapse of early Neolithic settlements in the southern Levant. In Hershkovitz, I. (ed.), People and Culture in Change, BAR International Series 508, 73-89." },
]

[params.soil_formation_rate]
group = "cultivation"
unit = "1/year"
description = "Soil formation: each year the eroded share of a cell's soil re-forms at this rate (toward full, whatever the land use)."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.00008279
prior = { dist = "log_uniform", lo = 0.00001, hi = 0.001 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 3.1e-05 to 8.8e-04 (10-90%). Soil production of 0.01-0.1 mm/yr refills a metre of soil over 10,000-100,000 years; faster rates stand for colluvium and fallow recovery."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Montgomery, D.R. (2007). Soil erosion and agricultural sustainability. PNAS 104, 13268-13272.", doi = "10.1073/pnas.0611508104" },
]

[params.soil_critical]
group = "cultivation"
unit = "soil share"
description = "Yields of fields hold while a cell keeps at least this share of its erodible soil, then fall linearly to nothing on bare rock."
kind = { type = "real", min = 0.01, max = 1.0 }
default = 0.3359
prior = { dist = "uniform", lo = 0.2, hi = 0.8 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.25 to 0.75 (10-90%). Cereal yields are insensitive to topsoil depth until roots run short of soil and water; then they fall steeply."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Lal, R. (1998). Soil erosion impact on agronomic productivity and environment quality. Critical Reviews in Plant Sciences 17, 319-464.", doi = "10.1080/07352689891304249" },
]

[params.obsidian_loss]
group = "exchange"
unit = "share per period"
description = "Share of obsidian used up or kept, not passed on, at each step of down-the-line exchange: away from its sources a cell's availability becomes (1 - loss) times the mean over itself and its occupied neighbors."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.002991
prior = { dist = "log_uniform", lo = 0.0003, hi = 0.1 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0025 to 0.078 (10-90%). Sets how fast obsidian falls off with distance along settled land: one e-fold every 1.5 res-5 cells (25 km) at 0.1, 4.3 (74 km) at 0.01, 7.1 (121 km) at 0.003 and 10.6 (180 km) at 0.001; at small losses the network takes about 1/loss years to settle. Renfrew's contact zone falls off over a few hundred kilometres (ADR-0060)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
  { citation = "Renfrew, C., Dixon, J.E., Cann, J.R. (1966). Obsidian and early cultural contact in the Near East. Proceedings of the Prehistoric Society 32, 30-72.", doi = "10.1017/S0079497X0001433X" },
  { citation = "Renfrew, C., Dixon, J.E., Cann, J.R. (1968). Further analysis of Near Eastern obsidians. Proceedings of the Prehistoric Society 34, 319-331.", doi = "10.1017/S0079497X0001392X" },
  { citation = "Renfrew, C. (1977). Alternative models for exchange and spatial distribution. In Earle, T.K., Ericson, J.E. (eds), Exchange Systems in Prehistory, 71-90. Academic Press.", doi = "10.1016/B978-0-12-227650-7.50010-9" },
  { citation = "Ortega, D., Ibanez, J.J., Campos, D., Khalidi, L., Mendez, V., Teira, L. (2016). Systems of interaction between the first sedentary villages in the Near East exposed using agent-based modelling of obsidian exchange. Systems 4, 18.", doi = "10.3390/systems4020018" },
]

