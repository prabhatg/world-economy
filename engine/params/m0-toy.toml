]

[params.soil_erosion_rate]
group = "cultivation"
unit = "soil share per year at full effort"
description = "Land-degradation hypothesis: share of a cell's erodible soil lost per year under full cultivation effort (in proportion to effort), for a soil 2 m deep or more; a soil d times as deep loses 1/d times the share, the same depth (bedrock pack, #24)."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.0003396
prior = { dist = "uniform", lo = 0.0, hi = 0.001 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 1.6e-05 to 0.00035 (10-90%). Zero switches the hypothesis off. Tilled land erodes one to two orders of magnitude faster than soil forms (about 1 mm/yr against 0.01-0.1 mm/yr); hoe and sickle farming of thin Mediterranean soils loses tens of centimetres over millennia: 1e-4 to 1e-3 of the erodible depth per year."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Montgomery, D.R. (2007). Soil erosion and agricultural sustainability. PNAS 104, 13268-13272.", doi = "10.1073/pnas.0611508104" },
  { citation = "Rollefson, G.O., Kohler-Rollefson, I. (1989). The collapse of early Neolithic settlements in the southern Levant. In Hershkovitz, I. (ed.), People and Culture in Change, BAR International Series 508, 73-89." },
]

[params.soil_formation_rate]
group = "cultivation"
unit = "1/year"
description = "Soil formation: each year the eroded share of a cell's soil re-forms at this rate (toward full, whatever the land use)."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.000705
prior = { dist = "log_uniform", lo = 0.00001, hi = 0.001 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 5.3e-05 to 0.00082 (10-90%). Soil production of 0.01-0.1 mm/yr refills a metre of soil over 10,000-100,000 years; faster rates stand for colluvium and fallow recovery."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Montgomery, D.R. (2007). Soil erosion and agricultural sustainability. PNAS 104, 13268-13272.", doi = "10.1073/pnas.0611508104" },
]

[params.soil_critical]
