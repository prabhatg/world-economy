prior = { dist = "uniform", lo = 0.2, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0065): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.29 to 0.91 (10-90%). Wild stands yield well when harvested at the right time; early cultivation was not more productive than foraging per hour of work."
sources = [
  { citation = "ManyWorlds M1 calibration, round 7 (ADR-0065): the best-fitting world consistent with the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records, with cultivation learned socially, calibration/runs/m1/round7/best.json (wave 9, run 208).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round7/best.json" },
