status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.66 to 7.1 (10-90%). Regional densities of early farmers were around one to a few people per km2, an order of magnitude above foragers."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
