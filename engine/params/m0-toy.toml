unit = "mm/yr"
description = "Wild cereals are absent below this annual precipitation."
kind = { type = "real", min = 0.0, max = 3000.0 }
default = 200.0
prior = { dist = "fixed" }
status = "placeholder"
note = "Wild barley reaches into the steppe at about 200 mm; wild wheats need more."
sources = [
  { citation = "Harlan, J.R., Zohary, D. (1966). Distribution of wild wheats and barley. Science 153, 1074-1080.", doi = "10.1126/science.153.3740.1074" },
