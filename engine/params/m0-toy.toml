# Parameter registry for the engine's mechanisms: the M0 toy mechanisms (growth, band
# fission, migration) and, from M1, foraging carrying capacity from forcing packs.
#
# Every parameter declares its unit, valid range, calibration prior, status and
# sources. Status "placeholder" means an engine-test value with no empirical claim;
# M1 replaces these with literature-based or calibrated values.
#
# Changing a default changes the golden hash (engine/golden/m0-toy.json).

name = "m0-toy"
version = 2

[params.period_ticks]
group = "time"
unit = "days"
description = "Period of the growth and fission mechanisms."
kind = { type = "integer", min = 1, max = 3650 }
default = 365
prior = { dist = "fixed" }
status = "placeholder"
note = "Yearly steps suit slow prehistoric dynamics; finer periods arrive with seasonal mechanisms in M1."

[params.growth_rate]
group = "demography"
unit = "1/period"
description = "Intrinsic growth rate r in logistic growth dw = r w (1 - N/K)."
kind = { type = "real", min = 0.0, max = 0.1 }
default = 0.01
prior = { dist = "uniform", lo = 0.001, hi = 0.03 }
status = "placeholder"
note = "Order of magnitude of local growth during the Neolithic demographic transition; not calibrated."
sources = [
  { citation = "Bocquet-Appel, J.-P. (2011). When the world's population took off: the springboard of the Neolithic Demographic Transition. Science 333, 560-561.", doi = "10.1126/science.1208880" },
]

[params.capacity_min]
group = "environment"
unit = "people per cell"
description = "Lower bound of the toy carrying capacity drawn per cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 20
prior = { dist = "fixed" }
status = "placeholder"
note = "Toy environment; M1 derives carrying capacity from climate, soils and biomes."

[params.capacity_max]
group = "environment"
unit = "people per cell"
description = "Upper bound of the toy carrying capacity drawn per cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 400
prior = { dist = "fixed" }
status = "placeholder"
note = "Toy environment; M1 derives carrying capacity from climate, soils and biomes."

[params.fission_threshold]
group = "social"
unit = "people"
description = "Bands at least this large may split."
kind = { type = "integer", min = 2, max = 10000 }
default = 60
prior = { dist = "uniform", lo = 30.0, hi = 150.0 }
status = "placeholder"
note = "About twice a typical forager residential group size; scalar-stress fission theory to be added in M1."
sources = [
  { citation = "Marlowe, F. W. (2005). Hunter-gatherers and human evolution. Evolutionary Anthropology 14, 54-67.", doi = "10.1002/evan.20046" },
]

[params.fission_probability]
group = "social"
unit = "probability per period"
description = "Probability that an eligible band splits in one period."
kind = { type = "probability" }
default = 0.2
prior = { dist = "uniform", lo = 0.05, hi = 0.5 }
status = "placeholder"
note = "Engine-test value."

[params.exploration_probability]
group = "migration"
unit = "probability"
description = "Probability that a daughter band moves to a random neighbor instead of the least crowded one."
kind = { type = "probability" }
default = 0.3
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "placeholder"
note = "Engine-test value."

[params.merge_threshold]
group = "resolution"
unit = "people"
description = "Agents smaller than this merge with other small agents in their cell (super-individual resolution control)."
kind = { type = "integer", min = 0, max = 1000 }
default = 10
prior = { dist = "fixed" }
status = "placeholder"
note = "Numerical resolution setting, not a behavioral claim."

[params.initial_bands]
group = "initial"
unit = "bands"
description = "Number of bands placed around the seed-chosen start cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 12
prior = { dist = "fixed" }
status = "placeholder"
note = "Engine-test value; M1 starts from reconstructed late-Pleistocene population estimates."

[params.initial_weight]
group = "initial"
unit = "people"
description = "People per initial band."
kind = { type = "integer", min = 1, max = 1000 }
default = 30
prior = { dist = "fixed" }
status = "placeholder"
note = "Close to typical forager residential group sizes."
sources = [
  { citation = "Marlowe, F. W. (2005). Hunter-gatherers and human evolution. Evolutionary Anthropology 14, 54-67.", doi = "10.1002/evan.20046" },
]

# Foraging carrying capacity (ADR-0047): used by worlds with a climate pack; toy worlds
# keep capacity_min/capacity_max.

[params.capacity_period_ticks]
group = "time"
unit = "days"
description = "How often carrying capacity is recomputed from the climate (which changes over centuries)."
kind = { type = "integer", min = 1, max = 36500 }
default = 3650
prior = { dist = "fixed" }
status = "placeholder"
note = "Ten years: well below the 100-year climate slices, and cheap enough to leave the step cost unchanged."

[params.miami_npp_max]
group = "foraging"
unit = "g dry matter m-2 yr-1"
description = "Miami model: asymptotic net primary productivity of the temperature and precipitation limits."
kind = { type = "real", min = 1.0, max = 10000.0 }
default = 3000.0
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_temp_offset]
group = "foraging"
unit = "1"
description = "Miami model temperature limit: NPP_T = max / (1 + exp(offset - slope T))."
kind = { type = "real", min = -10.0, max = 10.0 }
default = 1.315
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_temp_slope]
group = "foraging"
unit = "1/degC"
description = "Miami model temperature limit: slope on annual mean temperature."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.119
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_precip_slope]
group = "foraging"
unit = "1/mm"
description = "Miami model precipitation limit: NPP_P = max (1 - exp(-slope P)), P in mm per year."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.000664
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.npp_reference]
group = "foraging"
unit = "g dry matter m-2 yr-1"
description = "Productivity at which foragers live at forager_density_ref."
kind = { type = "real", min = 1.0, max = 5000.0 }
default = 1000.0
prior = { dist = "fixed" }
status = "placeholder"
note = "A normalizing constant (temperate woodland productivity); calibration moves forager_density_ref instead."

[params.forager_density_ref]
group = "foraging"
unit = "people/km2"
description = "Forager population density at the reference productivity, without aquatic resources."
kind = { type = "real", min = 0.001, max = 5.0 }
default = 0.1
prior = { dist = "log_uniform", lo = 0.02, hi = 0.5 }
status = "placeholder"
note = "Ethnographic terrestrial forager densities mostly fall between ~0.01 and ~1 person/km2; to be calibrated against radiocarbon density."
sources = [
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.npp_elasticity]
group = "foraging"
unit = "1"
description = "Elasticity of forager density with respect to net primary productivity: density = ref (NPP / NPP_ref)^elasticity."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 1.0
prior = { dist = "uniform", lo = 0.5, hi = 1.5 }
status = "placeholder"
note = "Forager density rises with productivity across ethnographic groups; the exponent is uncertain and calibrated."
sources = [
  { citation = "Tallavaara, M., Eronen, J.T., Luoto, M. (2018). Productivity, biodiversity, and pathogens influence the global hunter-gatherer population density. PNAS 115, 1232-1237.", doi = "10.1073/pnas.1715638115" },
]

[params.aquatic_bonus]
group = "foraging"
unit = "1"
description = "Forager density added where a perennial river, a lake shore or a sea coast is at hand, as a multiple of forager_density_ref (independent of local productivity)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.5
prior = { dist = "uniform", lo = 0.0, hi = 1.5 }
status = "placeholder"
note = "Foragers with aquatic resources reach higher densities, also in deserts (the Nile valley); magnitude to be calibrated."
sources = [
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
]

[params.perennial_discharge]
group = "foraging"
unit = "m3/s"
description = "Least long-term mean discharge for a river to count as a perennial aquatic resource."
kind = { type = "real", min = 0.0, max = 1000.0 }
default = 1.0
prior = { dist = "fixed" }
status = "placeholder"
note = "Matches the hydrology pack's threshold for river_length (wadis excluded)."
