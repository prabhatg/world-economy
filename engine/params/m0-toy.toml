[params.forager_density_ref]
group = "foraging"
unit = "people/km2"
description = "Forager population density at the reference productivity, without aquatic resources."
kind = { type = "real", min = 0.001, max = 5.0 }
default = 0.183
prior = { dist = "log_uniform", lo = 0.02, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.051 to 0.33 (10-90%). Ethnographic terrestrial forager densities mostly fall between ~0.01 and ~1 person/km2; calibrated against radiocarbon density."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.npp_elasticity]
group = "foraging"
unit = "1"
description = "Elasticity of forager density with respect to net primary productivity: density = ref (NPP / NPP_ref)^elasticity."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 1.219
prior = { dist = "uniform", lo = 0.5, hi = 1.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.61 to 1.4 (10-90%). Forager density rises with productivity across ethnographic groups; the exponent is uncertain and calibrated."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Tallavaara, M., Eronen, J.T., Luoto, M. (2018). Productivity, biodiversity, and pathogens influence the global hunter-gatherer population density. PNAS 115, 1232-1237.", doi = "10.1073/pnas.1715638115" },
]

[params.aquatic_bonus]
group = "foraging"
unit = "1"
description = "Forager density added where a perennial river, a lake shore or a sea coast is at hand, as a multiple of forager_density_ref (independent of local productivity)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.5
prior = { dist = "uniform", lo = 0.0, hi = 1.5 }
status = "placeholder"
note = "Foragers with aquatic resources reach higher densities, also in deserts (the Nile valley); magnitude to be calibrated."
sources = [
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
]

[params.perennial_discharge]
group = "foraging"
unit = "m3/s"
description = "Least long-term mean discharge for a river to count as a perennial aquatic resource."
kind = { type = "real", min = 0.0, max = 1000.0 }
default = 1.0
prior = { dist = "fixed" }
status = "placeholder"
note = "Matches the hydrology pack's threshold for river_length (wadis excluded)."

# Cultivation and domestication (ADR-0049): bands shift effort into cultivating wild
# cereals, driven by population pressure, climate stress or abundance (competing
# hypotheses nested as weights: set the others to zero to run one alone); cultivation
# selects for domestic traits, slowly or quickly (competing hypotheses as the range of
# selection_coefficient); domestic crops raise carrying capacity. Used by worlds with a
# climate pack; toy worlds never cultivate.

[params.herding_weight]
group = "cultivation"
unit = "1"
description = "Weight of wild herds' abundance in the share of effort a band aims to spend managing sheep and goats (#37): the target is herding_weight times the land it can herd on, the wild herds' range, and with a domestic herd the pasture beyond it in proportion to its domestic share. 0: nobody herds."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.12
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0090): with every other parameter at its calibrated default (herd_selection 0.035), 0.12 fits the summaries best (log-likelihood -66.9 for three seeds, against -69.4 at 0.1); alone, the values from 0.1 to 0.2 are consistent with every record and those at 0.08 and below or 0.35 and above are not, as sheep stay too wild or turn domestic too soon (Arbuckle et al. 2014). Round 11's consistent worlds span 0.16 to 0.82 (10-90%), trading it against the other parameters. The value began as cultivation's abundance weight: managing herds began where wild sheep and goats were hunted most, in the piedmont of the Taurus and Zagros, about 8,500-8,000 BCE (Zeder 2008), and is learned as cultivation is, from the people around a band (adoption_rate, innovation_share, neighbor_learning). Risk buffering against bad harvests and herds as wealth are not yet drivers."
sources = [
  { citation = "ManyWorlds M1 calibration, round 11 (ADR-0090): herd_selection from 0.002 to 0.1 and herding_weight from 0 to 0.8 with the other parameters at their calibrated defaults, three seeds each, calibration/runs/m1/round11/profile-herd-selection.json and profile-herding-weight.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/round11" },
  { citation = "Zeder, M.A. (2008). Domestication and early agriculture in the Mediterranean Basin: origins, diffusion, and impact. Proceedings of the National Academy of Sciences 105, 11597-11604.", doi = "10.1073/pnas.0801317105" },
  { citation = "Arbuckle, B.S. et al. (2014). Data sharing reveals complexity in the westward spread of domestic animals across Neolithic Turkey. PLoS ONE 9(6), e99845.", doi = "10.1371/journal.pone.0099845" },
]

[params.herd_pressure_weight]
group = "cultivation"
unit = "1"
description = "Weight of population pressure in the share of effort a band aims to spend herding (#44): people beyond cultivation_crowding times what foraging feeds, full at one capacity more, as for cultivation, add herd_pressure_weight times that pressure to the target wherever the band's flock can graze. 0: herding follows the land alone (ADR-0087)."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.0
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "placeholder"
note = "Off, as the M1 record prefers it at the other calibrated defaults (ADR-0092): need of 0.2 to 0.8 keeps every record consistent but fits the summaries worse (log-likelihood -67.9 at 0.4 and -74.9 at 0.8 against -65.6, seed 1), as more herding breeds sheep domestic sooner than their size falls in Arbuckle et al. (2014); with herd_selection 0.02 the best is -69.0 (0.8), and at 0.01 no value is consistent. Herders cross Sinai to the Nile only with 0.8 and wadis at the top of their prior, reaching it from about 4,000 BCE (a tenth of effort by 3,000), against goats in Egypt by about 5,900 BCE. A round that varies it with the herding parameters it trades against can test it again. Need turns people to more work per calorie when wild food falls short (Binford 1968; Cohen 1977), as for cultivation; where rain grows no crops, the work goes into flocks, which can be moved to whatever grazing there is, and it goes through domestic stock, as wild herds cannot be worked harder to feed more people. Goat herding reached Egypt by about 5,900 BCE with the herder-gatherers of the Negev and Sinai, before farming (about 5,350 BCE), and the oldest African caprines are from Sodmein Cave in the Eastern Desert, 6,200-5,000 BCE (Vermeersch et al. 2015)."
sources = [
  { citation = "Binford, L.R. (1968). Post-Pleistocene adaptations. In S.R. Binford and L.R. Binford (eds.), New Perspectives in Archeology, 313-341. Aldine." },
  { citation = "Vermeersch, P.M., Linseele, V., Marinova, E., Van Neer, W., Moeyersons, J. and Rethemeyer, J. (2015). Early and Middle Holocene human occupation of the Egyptian Eastern Desert: Sodmein Cave. African Archaeological Review 32, 465-503.", doi = "10.1007/s10437-015-9195-6" },
]

[params.herd_density]
group = "cultivation"
unit = "people/km2"
description = "People fed per km2 of pasture if all their effort went into herding fully domestic sheep and goats (#37); herds of wild animals yield wild_herd_ratio of it, on their range only."
kind = { type = "real", min = 0.0, max = 20.0 }
default = 1.0
prior = { dist = "log_uniform", lo = 0.2, hi = 4.0 }
status = "placeholder"
note = "Until calibrated: herding feeds fewer people per km2 than fields (farm_density 3.6) but on land that grows no crops; pastoralists' densities run from under one to a few people per km2 of their range."
sources = []

[params.wild_herd_ratio]
group = "cultivation"
unit = "1"
description = "Yield of managed wild herds as a share of domestic ones (#37), as wild_yield_ratio is for crops."
kind = { type = "probability" }
default = 0.5
prior = { dist = "uniform", lo = 0.1, hi = 1.0 }
status = "placeholder"
note = "Until calibrated: early management (culling young males, protecting females) of herds still wild in body and behavior yields less than herding docile domestic stock."
sources = []

[params.herd_selection]
group = "cultivation"
unit = "1/period"
description = "Selection toward domestic traits in a managed herd, per period at full herding effort, logistic in the herd's domestic share (#37), as selection_coefficient is for the crop."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.035
prior = { dist = "log_uniform", lo = 0.001, hi = 0.1 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0090): with every other parameter at its calibrated default, the values from 0.02 to 0.1 are consistent with every record for three seeds and those at 0.01 and below are not (sheep stay wild-sized too long; Arbuckle et al. 2014); 0.035 fits the summaries best (log-likelihood -66.9, against -67.7 at the placeholder 0.05 and -68.6 at 0.1), by more than the spread between seeds. Round 11's consistent worlds span 0.0027 to 0.039 (10-90%), trading it against the other parameters. The placeholder was a judgment: herds kept with a tenth of a band's effort become mostly domestic within about a millennium, as the size reduction that marks domestic sheep and goats follows management by about that (Zeder 2008); the crop's selection (0.009) would take five."
sources = [
  { citation = "ManyWorlds M1 calibration, round 11 (ADR-0090): herd_selection from 0.002 to 0.1 and herding_weight from 0 to 0.8 with the other parameters at their calibrated defaults, three seeds each, calibration/runs/m1/round11/profile-herd-selection.json and profile-herding-weight.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/round11" },
  { citation = "Zeder, M.A. (2008). Domestication and early agriculture in the Mediterranean Basin: origins, diffusion, and impact. Proceedings of the National Academy of Sciences 105, 11597-11604.", doi = "10.1073/pnas.0801317105" },
  { citation = "Arbuckle, B.S. et al. (2014). Data sharing reveals complexity in the westward spread of domestic animals across Neolithic Turkey. PLoS ONE 9(6), e99845.", doi = "10.1371/journal.pone.0099845" },
]

[params.herd_introgression]
group = "cultivation"
unit = "1/period"
description = "Gene flow from wild sheep and goats into a herd, per period at no herding effort, where wild herds range (#37), as introgression_rate is for the crop."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.0002
prior = { dist = "fixed" }
status = "placeholder"
note = "A judgment, the crop's calibrated introgression; herds kept beyond the wild animals' range keep their domestic traits."
sources = []

[params.herd_exchange]
group = "cultivation"
unit = "1/period"
description = "Share of a band's stock replaced each period by animals from the herds of the people it is tied to: its cell's and, by neighbor_learning, the cells around it, by the effort each herds (#51). Bands that herd nothing take animals too, to start a herd."
kind = { type = "probability" }
default = 0.2
prior = { dist = "log_uniform", lo = 0.001, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0116): with the reserve at 0.2, reach 250 km and floodplain grazing 0.25, 0.05 to 0.2 are consistent with every record for three seeds and 0.3 is not (exchange with wild-caught stock keeps the Levant's sheep wild-sized after 6,500 BCE); 0.2 fits the summaries best (log-likelihood -83.3, against -83.6 at 0.1 and -84.0 at 0.05), within the spread between seeds. Herders give, lend and marry with animals along kinship, marriage and friendship ties, which pool the risk of losing a herd to drought or disease (the Maasai's osotua gifts: Aktipis, Cronk and de Aguiar 2011), and hunters took a few animals into their own economy that way: Egypt's first domestic animals, from the 6th millennium BCE, are a handful of bones among the game of mobile desert groups, a 'food reserve on the hoof' without farming (Linseele et al. 2014). Without it, domestic animals reach land where no wild sheep or goats lived only with people who move there."
sources = [
  { citation = "ManyWorlds M1 calibration, profiles of the four Egypt hypotheses with Egypt's domestic animals judged (ADR-0116): herder_reach_km, herd_reserve, herd_exchange and floodplain_grazing each over its prior with the other three held, the rest at their calibrated defaults, three seeds each, calibration/runs/m1/f51/judged-*.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f51" },
  { citation = "Aktipis, C.A., Cronk, L., de Aguiar, R. (2011). Risk-pooling and herd survival: an agent-based model of a Maasai gift-giving system. Human Ecology 39, 131-140.", doi = "10.1007/s10745-010-9364-9" },
  { citation = "Linseele, V. et al. (2014). New archaeozoological data from the Fayum 'Neolithic' with a critical assessment of the evidence for early stock keeping in Egypt. PLoS ONE 9(10): e108517.", doi = "10.1371/journal.pone.0108517" },
]

[params.herd_reserve]
group = "cultivation"
unit = "1"
description = "Least share of effort a band with a fully domestic herd keeps on it wherever its land grazes any, in proportion to the herd's domestic share: a reserve of food that keeps, however little the land repays herding (#51). Where the land repays more (herding_weight, herd_pressure_weight), the land sets the effort. 0: herds kept for what the land repays alone."
kind = { type = "probability" }
default = 0.2
prior = { dist = "uniform", lo = 0.0, hi = 0.2 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0116): with exchange 0.2, reach 250 km and floodplain grazing 1, only 0.2, the prior's top, is consistent with Egypt's domestic animals for three seeds (summaries -83.3); at 0.15 and 0.1 too few of the 6th millennium's desert assemblages hold domestic animals (-87.2 and -101.6). Beyond the prior, 0.3 and 0.4 are inconsistent with Egypt's crops (ADR-0118): the records bound it at about 0.2. Egypt's first herders were mobile hunters of the 6th millennium BCE who kept a handful of sheep and goats among their game, as 'a kind of food reserve on the hoof' whose value lay in its predictable availability (Linseele et al. 2014); keeping stock as insurance against lean years is how herders themselves explain herd sizes beyond present need (Dahl and Hjort 1976). The prior's top is a fifth of effort, more than the handful of bones the desert sites hold."
sources = [
  { citation = "ManyWorlds M1 calibration, profiles of the four Egypt hypotheses with Egypt's domestic animals judged (ADR-0116): herder_reach_km, herd_reserve, herd_exchange and floodplain_grazing each over its prior with the other three held, the rest at their calibrated defaults, three seeds each, calibration/runs/m1/f51/judged-*.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f51" },
  { citation = "Linseele, V. et al. (2014). New archaeozoological data from the Fayum 'Neolithic' with a critical assessment of the evidence for early stock keeping in Egypt. PLoS ONE 9(10): e108517.", doi = "10.1371/journal.pone.0108517" },
  { citation = "Dahl, G., Hjort, A. (1976). Having Herds: Pastoral Herd Growth and Household Economy. Stockholm Studies in Social Anthropology 2. University of Stockholm." },
]

[params.herder_reach_km]
group = "migration"
unit = "km"
description = "How far a group of herders leaving a crowded place travels to find land that can take it and its flocks, when no neighboring place can (#51): over habitable land, from catchment to neighboring catchment, the nearest place with room within this distance, the least crowded of those as near. A band goes so with the chance that it lives by domestic herds (its herding effort times its herd's domestic share). 0: groups go to neighboring places only."
kind = { type = "real", min = 0.0, max = 400.0 }
default = 250.0
prior = { dist = "uniform", lo = 0.0, hi = 250.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0116): with the reserve at 0.2, exchange 0.2 and floodplain grazing 1, only 250 km, the prior's top, is consistent with Egypt's domestic animals for three seeds (summaries -83.3); at 200 km the 6th millennium's desert assemblages show domestic animals at 0.46-0.60 against the record's 1, two seeds of three failing (-85.0), and at 150 km at 0.20-0.42 (-91.9). Beyond the prior, 300 to 400 km are consistent and flat within the seeds' spread (ADR-0118), so it stays nearest the record's 150-200 km. Egypt's desert groups of the 6th millennium BCE, who kept the first sheep and goats, were highly mobile: Djara's people moved between the plateau and the Nile valley, about 150 km, and the Farafra sites hold things from the valley, about 200 km away (Linseele et al. 2014). People move as short a way as will do, to the nearest opportunity (intervening opportunities, Stouffer 1940), and herders travel far for grazing when the land near them is taken (Dahl and Hjort 1976). The prior's top is a little beyond the 200 km of the record."
sources = [
  { citation = "ManyWorlds M1 calibration, profiles of the four Egypt hypotheses with Egypt's domestic animals judged (ADR-0116): herder_reach_km, herd_reserve, herd_exchange and floodplain_grazing each over its prior with the other three held, the rest at their calibrated defaults, three seeds each, calibration/runs/m1/f51/judged-*.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f51" },
  { citation = "Linseele, V. et al. (2014). New archaeozoological data from the Fayum 'Neolithic' with a critical assessment of the evidence for early stock keeping in Egypt. PLoS ONE 9(10): e108517.", doi = "10.1371/journal.pone.0108517" },
  { citation = "Stouffer, S. A. (1940). Intervening opportunities: a theory relating mobility and distance. American Sociological Review 5(6), 845-867.", doi = "10.2307/2084520" },
  { citation = "Dahl, G., Hjort, A. (1976). Having Herds: Pastoral Herd Growth and Household Economy. Stockholm Studies in Social Anthropology 2. University of Stockholm." },
]

[params.harvest_cv]
group = "environment"
unit = "1"
description = "Year-to-year spread of a rain-fed harvest (coefficient of variation) where rain no longer limits wild cereals (cereal_precip_full and wetter); drier, it grows as the square root of cereal_precip_full over the rain, to at most 1 (#13). Floodplain fields swing at this value. Each year's harvest is the mean times 1 + the spread times a standard shock (harvest_correlation), at least 0. 0: every year alike."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.4
prior = { dist = "uniform", lo = 0.2, hi = 0.6 }
status = "literature"
note = "A judgment from the records of rain and yields in the dry Near East: rain's year-to-year spread falls as rain rises, to about 500 mm (Golodets et al. 2013, on a gradient from 90 to 780 mm in Israel); Jordan's cereal lands have rainfall CVs of 36% at 400 mm and 48% to 80% drier; dry-farmed yields swing further than rain, from nothing to three times the mean (FAO 2008), barley's CV 94% in northeast Iran. So 0.4 where rain no longer limits cereals. The square-root form is a judgment: at the defaults the spread is 0.4 at 350 mm, 0.53 at 200 mm (the dry limit of farming, Wilkinson 1994) and 0.75 at 100 mm. The shock is linear: the threshold below which a dry-farmed crop fails outright is left out. The M1 records bound it weakly (ADR-0122, ADR-0123; calibration/runs/m1/f13/, three seeds each): with storage at the defaults 0.2 and 0.4 are consistent (summaries -83.7 and -82.6) and 0.6 is not (-86.3), through Egypt's 6th-millennium desert animals, a record within its tolerance's reach of seed noise alone; without storage 0.4 and 0.6 are inconsistent where foragers feel half a farmer's swings (-96.4 and -161.1)."
sources = [
  { citation = "ManyWorlds M1 profiles of harvest risk at the calibrated defaults (ADR-0122): calibration/runs/m1/f13/.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f13" },
  { citation = "Golodets, C., Sternberg, M., Kigel, J., Boeken, B., Henkin, Z., Seligman, N., Ungar, E. (2013). From desert to Mediterranean rangelands: will increasing drought and inter-annual rainfall variability affect herbaceous annual primary productivity? Climatic Change 119, 785-798.", doi = "10.1007/s10584-013-0758-8" },
  { citation = "FAO (2008). Enhancing cereal production in drylands (I0372E): dryland farming regions receive from about 50% to 200% of their mean rain in a year, and yields range from about 0 to 3 times the mean.", url = "https://www.fao.org/4/i0372e/i0372e03.pdf" },
  { citation = "Wilkinson, T.J. (1994). The structure and dynamics of dry-farming states in Upper Mesopotamia. Current Anthropology 35(5), 483-520." },
  { citation = "Halstead, P., O'Shea, J. (eds.) (1989). Bad Year Economics: Cultural Responses to Risk and Uncertainty. Cambridge University Press." },
]

[params.forage_risk_ratio]
group = "foraging"
unit = "1"
description = "Share of a harvest's year-to-year spread (harvest_cv) a band feels when it forages or herds rather than cultivates (#13): wild foods are many, and foragers and herders move to where the rain fell; a band's spread moves linearly with its cultivation effort from this share to the whole."
kind = { type = "probability" }
default = 0.2
prior = { dist = "uniform", lo = 0.05, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 by profile (ADR-0122, ADR-0123): with harvest_cv 0.4 and storage at the defaults, 0.1 and 0.2 are consistent for three seeds (summaries -82.8 and -82.6), 0.35 and 0.5 are not (-84.8 and -88.9), too few of Egypt's 6th-millennium desert assemblages holding domestic animals as bad years thin the desert's foragers and herders; without storage only 0.1 is (-80.6). Foragers buffer risk by widening their diet and by moving (Winterhalder 1986; Kelly 2013), herders by moving their herds to where the rain fell; in the model this share stands for both, until bad-year moves are modelled (#13). Wild grasses and game still fail in drought (Golodets et al. 2013), so the share is above 0; the prior reaches down to 0.05."
sources = [
  { citation = "ManyWorlds M1 profiles of forage_risk_ratio with harvest_cv 0.4 at the calibrated defaults, with and without storage (ADR-0122, ADR-0123): calibration/runs/m1/f13/profile-forage-risk-ratio-storage.json and profile-forage-risk-ratio.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f13" },
  { citation = "Winterhalder, B. (1986). Diet choice, risk, and food sharing in a stochastic environment. Journal of Anthropological Archaeology 5, 369-392." },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.harvest_correlation]
group = "environment"
unit = "1"
description = "Share of each year's harvest shock the whole region shares (#13): a cell's shock is the square root of this times the region's plus the square root of the rest times its own, so a drought strikes many cells at once. 0: every cell's year its own."
kind = { type = "probability" }
default = 0.3
prior = { dist = "uniform", lo = 0.0, hi = 0.6 }
status = "placeholder"
note = "A judgment: droughts in the eastern Mediterranean span hundreds of kilometres, but the region reaches from the Nile to the Zagros, whose years differ; one regional shock with a cell's own stands for a correlation that in truth falls with distance. Years are drawn independently: multi-year droughts are left out."
sources = [
  { citation = "Halstead, P., O'Shea, J. (eds.) (1989). Bad Year Economics: Cultural Responses to Risk and Uncertainty. Cambridge University Press." },
]

[params.storage_years]
group = "cultivation"
unit = "years"
description = "Food a group cultivating fully can keep, in years of its people's need (#13): in a year whose harvest feeds more than its people, a group puts the surplus by, up to this times its cultivation effort; in a year that feeds fewer, it eats from the store. 0: nobody stores."
kind = { type = "real", min = 0.0, max = 2.0 }
default = 0.5
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "placeholder"
note = "A judgment, which the M1 records bound (ADR-0123; calibration/runs/m1/f13/profile-storage-years.json, three seeds each): with harvest risk at its defaults, 0.25, 0.5 and 1 are consistent (summaries -81.3, -82.6 and -83.8) and 0 is not (-84.2: without stores bad years thin Egypt's farmers and herders so that too few of its 6th-millennium desert assemblages hold domestic animals); the summaries tell the three apart by less than the seeds' spread, so the judgment stays. Storing is the farmers' first answer to a bad year (Halstead and O'Shea 1989): granaries from before domestication at Dhra' (Kuijt and Finlayson 2009) and household stores at Catalhoyuk (Bogaard et al. 2009). It needs a delayed-return economy and norms that let a household keep its store against demands to share (Woodburn 1982; Testart 1982), which settled cultivators have and mobile foragers mostly do not, so the capacity moves with cultivation effort and foragers keep none."
sources = [
  { citation = "ManyWorlds M1 profile of storage_years at the calibrated defaults (ADR-0123): calibration/runs/m1/f13/profile-storage-years.json.", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/f13/profile-storage-years.json" },
  { citation = "Kuijt, I., Finlayson, B. (2009). Evidence for food storage and predomestication granaries 11,000 years ago in the Jordan Valley. Proceedings of the National Academy of Sciences 106(27), 10966-10970.", doi = "10.1073/pnas.0812764106" },
  { citation = "Bogaard, A., Charles, M., Twiss, K.C., Fairbairn, A., Yalman, N., Filipovic, D., Demirergi, G.A., Ertug, F., Russell, N., Henecke, J. (2009). Private pantries and celebrated surplus: storing and sharing food at Neolithic Catalhoyuk, Central Anatolia. Antiquity 83(321), 649-668." },
  { citation = "Testart, A. (1982). The significance of food storage among hunter-gatherers: residence patterns, population densities, and social inequalities. Current Anthropology 23(5), 523-537." },
  { citation = "Woodburn, J. (1982). Egalitarian societies. Man 17(3), 431-451." },
  { citation = "Halstead, P., O'Shea, J. (eds.) (1989). Bad Year Economics: Cultural Responses to Risk and Uncertainty. Cambridge University Press." },
]

[params.storage_loss]
group = "cultivation"
unit = "1/year"
description = "Share of a group's stored food lost each year to insects, rodents and moulds (#13)."
kind = { type = "probability" }
default = 0.1
prior = { dist = "uniform", lo = 0.05, hi = 0.3 }
status = "placeholder"
note = "A judgment: traditional village stores lose about 5% a year where losses were measured (FAO 1994), and farmers' own estimates run higher; the pits, bins and jars of the early Neolithic likely lost more, so 0.1 within 0.05-0.3."
sources = [
  { citation = "FAO (1994). Grain storage techniques: evolution and trends in developing countries, chapter 6: post-harvest losses. FAO Agricultural Services Bulletin 109.", url = "https://www.fao.org/4/W1544E/W1544E05.htm" },
]

[params.bad_year_moves]
group = "foraging"
unit = "1"
description = "How far a bad or good year's harvest, rather than the land's long-run mean, decides whether a group leaves its cell and where it goes (#13): 0 judges the land by its mean, 1 by the year's harvest at the group's practice. A group with food stored stays through a bad year."
kind = { type = "probability" }
default = 0.0
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 by profile (ADR-0125): at the calibrated defaults, 0 is consistent for three seeds (summaries -82.6), 0.5 and 1 are not (-83.7 and -84.6), the share of Egypt's 6th-millennium desert assemblages holding domestic animals (the record: all) falling from 0.61-0.65 over the seeds to 0.42-0.70 and 0.39-0.56, past its cutoff for two seeds of three at each, so the land is judged by its mean, as before. Moving is the first answer to a bad year (Halstead and O'Shea 1989): foragers leave camps whose returns have fallen and herders take their flocks to where the rain fell (Kelly 2013), and people weigh what they have just lived through heavily (decisions from experience, Hertwig et al. 2004). In the model years are independent, so a year's move takes a group to land the next year treats as any other, and forage_risk_ratio already stands for moving within the year; the hypothesis stays, switched off, for the data to judge again."
sources = [
  { citation = "Halstead, P., O'Shea, J. (eds.) (1989). Bad Year Economics: Cultural Responses to Risk and Uncertainty. Cambridge University Press.", doi = "10.1017/CBO9780511521218" },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
  { citation = "Hertwig, R., Barron, G., Weber, E.U., Erev, I. (2004). Decisions from experience and the effect of rare events in risky choice. Psychological Science 15, 534-539.", doi = "10.1111/j.0956-7976.2004.00715.x" },
  { citation = "ManyWorlds M1 profile of bad_year_moves at the calibrated defaults (ADR-0125): calibration/runs/m1/f13/profile-bad-year-moves.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f13" },
]

[params.harvest_sharing]
group = "foraging"
unit = "1"
description = "Share of a year's harvest a group pools with the groups of its neighboring cells (#13): it lives on the rest of its own harvest and that share of the mean of theirs, at its own practice, so it draws on neighbors the year favoured and gives in turn when they are short."
kind = { type = "probability" }
default = 0.1
prior = { dist = "uniform", lo = 0.0, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 by profile (ADR-0126): at the calibrated defaults 0 and 0.1 are consistent for three seeds (summaries -82.6 and -81.0), 0.25 and 0.5 are not (-83.2 and -83.1): sharing keeps more of Egypt's 6th-millennium desert assemblages holding domestic animals, as the record has them, but past 0.1 brings crops into some of its 6th-millennium assemblages, which held none; the summaries tell 0 and 0.1 apart by less than the seeds' spread. Among foragers, partners in other camps share food and access to land in bad years (hxaro, Wiessner 1982); among early farmers, households and villages exchange food and obligations against future need (social storage, Halstead 1989). Transfers that follow need rather than accounts pool risk best where harvests are volatile (Aktipis et al. 2016), and people with other buffers, stores or herds, lean on reciprocity less (Cashdan 1985). The prior keeps most of a group's harvest its own."
sources = [
  { citation = "Wiessner, P. (1982). Risk, reciprocity and social influences on !Kung San economics. In Leacock, E., Lee, R. (eds.), Politics and History in Band Societies, 61-84. Cambridge University Press." },
  { citation = "Halstead, P. (1989). The economy has a normal surplus: economic stability and social change among early farming communities of Thessaly, Greece. In Halstead, P., O'Shea, J. (eds.), Bad Year Economics, 68-80. Cambridge University Press.", doi = "10.1017/CBO9780511521218.006" },
  { citation = "Aktipis, A., de Aguiar, R., Flaherty, A., Iyer, P., Sonkoi, D., Cronk, L. (2016). Cooperation in an uncertain world: for the Maasai of East Africa, need-based transfers outperform account-keeping in volatile environments. Human Ecology 44, 353-364.", doi = "10.1007/s10745-016-9823-z" },
  { citation = "ManyWorlds M1 profile of harvest_sharing at the calibrated defaults (ADR-0126): calibration/runs/m1/f13/profile-harvest-sharing.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f13" },
  { citation = "Cashdan, E. (1985). Coping with risk: reciprocity among the Basarwa of northern Botswana. Man 20, 454-474.", doi = "10.2307/2802441" },
]

[params.herd_wild_frequency]
group = "cultivation"
unit = "1"
description = "Share of animals with domestic-type traits in wild herds, from which selection starts where wild sheep and goats range (#37)."
kind = { type = "probability" }
default = 0.005
prior = { dist = "fixed" }
status = "placeholder"
note = "A judgment near the crop's: docile, smaller animals among wild herds; selection outside the wild range only works on herds brought there."
sources = []

[params.pasture_precip_min]
group = "cultivation"
unit = "mm/year"
description = "Annual precipitation below which land grows no grazing for sheep and goats (#37)."
kind = { type = "real", min = 0.0, max = 1000.0 }
default = 150.0
prior = { dist = "fixed" }
status = "placeholder"
note = "A judgment: steppe grazing reaches below the dry-farming limit (about 200-250 mm), into the desert margins."
sources = []

[params.pasture_precip_full]
group = "cultivation"
unit = "mm/year"
description = "Annual precipitation above which land grows full grazing for sheep and goats (#37)."
kind = { type = "real", min = 0.0, max = 2000.0 }
default = 300.0
prior = { dist = "fixed" }
status = "placeholder"
note = "A judgment: the steppe and open woodland of the Fertile Crescent's margins."
sources = []

[params.wadi_share]
group = "cultivation"
unit = "1"
description = "Share of dry land in wadi beds and hollows that collect runoff from the rest (#44): there grazing grows as on open land with the rain plus runoff_coefficient of the rain on the rest of the land, so deserts below pasture_precip_min still graze flocks along their wadis. 0: no wadis."
kind = { type = "real", min = 0.0, max = 0.5 }
default = 0.03
prior = { dist = "log_uniform", lo = 0.01, hi = 0.1 }
status = "placeholder"
note = "A judgment: wadi channels and their floors are a few percent of desert uplands, and runoff from the slopes around them concentrates the rain of the open land there, as the Negev's ancient runoff fields used (Bruins et al. 2019, runoff_coefficient); herders in the Negev and Sinai lived along wadis, springs and the coast. A finer grid could take the share from terrain."
sources = []

[params.runoff_coefficient]
group = "cultivation"
unit = "1"
description = "Share of the rain on the land outside wadis that runs off into them (#44)."
kind = { type = "probability" }
default = 0.1
prior = { dist = "uniform", lo = 0.05, hi = 0.3 }
status = "literature"
note = "The average annual runoff coefficient used for the catchments of the ancient terraced wadi fields of Horvat Haluqim in the central Negev Highlands, approximate (Bruins et al. 2019); small loess and rock catchments yield more in heavy storms and less in light ones."
sources = [
  { citation = "Bruins, H.J., Bithan-Guedj, H. and Svoray, T. (2019). GIS-based hydrological modelling to assess runoff yields in ancient-agricultural terraced wadi fields (central Negev desert). Journal of Arid Environments 166, 91-107." },
]

[params.floodplain_yield]
group = "cultivation"
unit = "1"
description = "Yield of domestic crops on a river's floodplain, sown in the soil its flood has watered, as a multiple of rain-fed crops at full wild-cereal suitability (ADR-0085). Floodplain fields add what this exceeds rain-fed suitability by, on the share of a cell its rivers flood (the hydrology pack's floodplain_fraction), and need warmth but no rain. 0: no floodplain farming."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 1.0
prior = { dist = "uniform", lo = 0.0, hi = 2.0 }
status = "placeholder"
note = "Until calibrated, the same as rain-fed fields at full suitability. Flood-recession farming of emmer and barley on the Nile's basins needed no rain or canals and its soil was renewed by the silt each flood left (Butzer 1976); the Mesopotamian alluvium's rivers flood at the wrong season for it and were farmed by short canals from the Ubaid on (Adams 1981), which this treats alike. The floodplain is GIEMS-D15's maximum inundation along modern reaches, a proxy for the Holocene's."
sources = [
  { citation = "Butzer, K.W. (1976). Early Hydraulic Civilization in Egypt: A Study in Cultural Ecology. University of Chicago Press." },
  { citation = "Adams, R.McC. (1981). Heartland of Cities: Surveys of Ancient Settlement and Land Use on the Central Floodplain of the Euphrates. University of Chicago Press." },
]

[params.floodplain_grazing]
group = "cultivation"
unit = "1"
description = "Share of the land a river floods (the hydrology pack's floodplain_fraction) that grazes domestic sheep and goats whatever the rain, on the land rain does not already graze (#51). Wild herds' range does not grow: they lived in the uplands. 0: grazing from rain alone."
kind = { type = "probability" }
default = 0.25
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0116): with the reserve at 0.2, exchange 0.2 and reach 250 km, 0.1 to 1 are consistent with every record for three seeds and flat (summaries -83.0 to -83.3), 0 is not (-84.7: the 5th millennium's Nile villages without herds); 0.25, which the profile chose, is kept. Grass grows on the flood's silt as the water recedes, and herders grazed the Nile's basins and the Delta's marsh edges in the dry season (Butzer 1976); Egypt's 5th-millennium BCE villages on the Nile and the Fayum kept sheep, goats and cattle in numbers where rain grows no grazing at all (Linseele et al. 2014). Without it, the model's Nile valley grazes no herds."
sources = [
  { citation = "ManyWorlds M1 calibration, profiles of the four Egypt hypotheses with Egypt's domestic animals judged (ADR-0116): herder_reach_km, herd_reserve, herd_exchange and floodplain_grazing each over its prior with the other three held, the rest at their calibrated defaults, three seeds each, calibration/runs/m1/f51/judged-*.json.", url = "https://github.com/prabhatg/world-economy/tree/main/calibration/runs/m1/f51" },
  { citation = "Butzer, K.W. (1976). Early Hydraulic Civilization in Egypt: A Study in Cultural Ecology. University of Chicago Press." },
  { citation = "Linseele, V. et al. (2014). New archaeozoological data from the Fayum 'Neolithic' with a critical assessment of the evidence for early stock keeping in Egypt. PLoS ONE 9(10): e108517.", doi = "10.1371/journal.pone.0108517" },
]

[params.humid_period_scale]
group = "environment"
unit = "1"
description = "Multiple of the African Humid Period's reconstructed rain (the humid_period pack's precip_anomaly, ADR-0084) added to the forcing's precipitation while the period lasts. 0: the forcing's climate alone."
kind = { type = "real", min = 0.0, max = 10.0 }
default = 4.0
prior = { dist = "uniform", lo = 0.0, hi = 10.0 }
status = "placeholder"
note = "Four times the fit: the least that settles the Western Desert while the Humid Period lasts, and the nearest the estimates of the values that fit the summaries best. CHELSA-TraCE21k's CCSM3 climate has no Green Sahara (under 5 mm a year in the Western Desert throughout). The anomaly is an exponential in latitude fitted to Bartlein et al.'s two Eastern Saharan 6 ka cells (+605 mm at 19 N, where the West Nubian Palaeolake needed 500-900 mm, Hoelzmann et al. 2000; +177 mm at 21 N) and to the Western Desert's estimates from its sites' charcoal and fauna (100 mm at Nabta Playa, 22.5 N; 71 mm from the Gilf Kebir to Djara, about 25 N; ADR-0093): +79 mm at 24 N, +46 mm at Dakhla, +27 mm at 27 N. A profile at the calibrated defaults (calibration/runs/m1/round12/profile-humid-period-scale.json; three seeds each, every one consistent) fits the summaries best at 4 (-64.6 to -64.7, against -65.4 to -66.0 at 0 to 2); at 1 the desert stays empty, at 2 it is reached only from 6,000 BCE, at 4 the Dakhla block from 8,000 BCE and the Gilf Kebir's from 7,000 BCE, peaking at 6,000-5,000 BCE as their dates do a millennium earlier. That is 315 mm at 24 N, 186 mm at Dakhla and 110 mm at Farafra, above the estimates (30-200 mm): the model spreads rain evenly where foragers lived by playas and pools that gathered it (Bubenzer and Riemer 2007), so the scale stands for that too. The prior reaches 10, the parameter's limit (ADR-0094): from 4 to 10 the summaries are flat (-64.4 to -64.7, profile-humid-period-scale-wide.json), while northeast Africa's 10% point, then unjudged, came nearer the record (implausibility 3.2 at 4, 1.8 at 10), partly by making up with desert dates for the Delta's foragers (open question 40). With those out of sight and the subregion judged (ADR-0095; calibration/runs/m1/round13/profile-humid-period-scale.json), 0 and 2 are inconsistent with it, and 4 to 10 consistent and nearly flat (summaries -87.5 to -85.9; its 10% implausibility 1.9-2.0 at 4, 0.8 at 10), so 4 stays, nearest the estimates, for a round to vary."
sources = [
  { citation = "Bartlein, P.J., Harrison, S.P., Brewer, S., et al. (2011). Pollen-based continental climate reconstructions at 6 and 21 ka: a global synthesis. Climate Dynamics 37, 775-802.", doi = "10.1007/s00382-010-0904-1" },
  { citation = "Hoelzmann, P., Kruse, H.-J., Rottinger, F. (2000). Precipitation estimates for the eastern Saharan palaeomonsoon based on a water balance model of the West Nubian Palaeolake Basin. Global and Planetary Change 26, 105-120.", doi = "10.1016/S0921-8181(00)00038-2" },
  { citation = "Bubenzer, O., Riemer, H. (2007). Holocene climatic change and human settlement between the central Sahara and the Nile Valley: archaeological and geomorphological results. Geoarchaeology 22, 607-620 (citing Neumann 1989).", doi = "10.1002/gea.20176" },
  { citation = "Wendorf, F., Schild, R. (1998). Nabta Playa and its role in northeastern African prehistory. Journal of Anthropological Archaeology 17, 97-123 (citing Neumann 1989, Barakat 1995, Wendorf and Schild 1980).", doi = "10.1006/jaar.1998.0319" },
]

[params.humid_period_onset_bp]
group = "environment"
unit = "years before 1950"
description = "Midpoint of the African Humid Period's onset (ADR-0084): its rain rises over humid_period_transition_years centered here."
kind = { type = "integer", min = 3000, max = 15000 }
default = 11000
prior = { dist = "fixed" }
status = "literature"
note = "Leaf-wax precipitation off the Sahara rises between 12,000 and 10,000 years ago at 19-23 N (Tierney et al. 2017), as the Younger Dryas ends; the onset was broadly synchronous across North Africa, unlike the end (Shanahan et al. 2015). The radiocarbon record leaves northeast Africa almost empty before 9,100 BCE, so it barely sees the onset."
sources = [
  { citation = "Tierney, J.E., Pausata, F.S.R., deMenocal, P.B. (2017). Rainfall regimes of the Green Sahara. Science Advances 3, e1601503.", doi = "10.1126/sciadv.1601503" },
  { citation = "Shanahan, T.M., McKay, N.P., Hughen, K.A., et al. (2015). The time-transgressive termination of the African Humid Period. Nature Geoscience 8, 140-144.", doi = "10.1038/ngeo2329" },
]

[params.humid_period_end_bp]
group = "environment"
unit = "years before 1950"
description = "Midpoint of the African Humid Period's end in northeast Africa (ADR-0084): its rain falls over humid_period_transition_years centered here."
kind = { type = "integer", min = 3000, max = 12000 }
default = 6500
prior = { dist = "uniform", lo = 5000.0, hi = 8500.0 }
status = "literature"
note = "The end came earlier the farther north (Shanahan et al. 2015): about 5,000 years ago at 20-23 N on the West African margin (Tierney et al. 2017), so earlier over Egypt, at 24-30 N. The default is an estimate between them; the prior spans 8,500 to 5,000 years ago, and the radiocarbon record of northeast Africa, the only record here that sees it, constrains it."
sources = [
  { citation = "Shanahan, T.M., McKay, N.P., Hughen, K.A., et al. (2015). The time-transgressive termination of the African Humid Period. Nature Geoscience 8, 140-144.", doi = "10.1038/ngeo2329" },
  { citation = "Tierney, J.E., Pausata, F.S.R., deMenocal, P.B. (2017). Rainfall regimes of the Green Sahara. Science Advances 3, e1601503.", doi = "10.1126/sciadv.1601503" },
]

[params.humid_period_transition_years]
group = "environment"
unit = "years"
description = "Duration of the African Humid Period's onset and of its end (ADR-0084), each linear in time."
kind = { type = "integer", min = 100, max = 3000 }
default = 500
prior = { dist = "fixed" }
status = "literature"
note = "The end was abrupt at each site, a few centuries, though later southward (Shanahan et al. 2015; Tierney et al. 2017); the forcing's slices are a century apart."
sources = [
  { citation = "Shanahan, T.M., McKay, N.P., Hughen, K.A., et al. (2015). The time-transgressive termination of the African Humid Period. Nature Geoscience 8, 140-144.", doi = "10.1038/ngeo2329" },
]

[params.climate_anomaly_temp]
group = "environment"
unit = "degC per permil"
description = "Warming per unit of the climate_anomaly pack's index (#41): decadal anomalies with their century-scale signal removed (NGRIP d18O, permil), added to the climate pack's annual mean temperature. 0: the century means alone."
kind = { type = "real", min = -10.0, max = 10.0 }
default = 1.0
prior = { dist = "uniform", lo = 0.0, hi = 3.0 }
status = "literature"
note = "The 8.2 ka event is about -1 permil in NGRIP (Morrill et al. 2013a, Table 3: -1.0 mean over 140 years; the M1 pack's century ending 6,200 BCE: -1.0) and cooled mean annual temperature by about 1 degC or less at most sites outside Greenland (Morrill et al. 2013a); in the northern Aegean winters cooled by 2.8 degC on average (error 2.5; Tenaghi Philippon pollen, Pross et al. 2009). So 1 degC per permil, and a prior from none to 3 degC. Climate models give about half the proxies' cooling (Morrill et al. 2013b). Decadal swings outside the events are mostly Greenland's own noise (sd 0.4 permil), so they shift M1 by about 0.4 degC, unrelated to its real decades."
sources = [
  { citation = "Morrill, C., Anderson, D.M., Bauer, B.A., et al. (2013a). Proxy benchmarks for intercomparison of 8.2 ka simulations. Climate of the Past 9, 423-432.", doi = "10.5194/cp-9-423-2013" },
  { citation = "Pross, J., Kotthoff, U., Mueller, U.C., et al. (2009). Massive perturbation in terrestrial ecosystems of the Eastern Mediterranean region associated with the 8.2 kyr B.P. climatic event. Geology 37, 887-890.", doi = "10.1130/G25739A.1" },
  { citation = "Morrill, C., LeGrande, A.N., Renssen, H., Bakker, P., Otto-Bliesner, B.L. (2013b). Model sensitivity to North Atlantic freshwater forcing at 8.2 ka. Climate of the Past 9, 955-968.", doi = "10.5194/cp-9-955-2013" },
]

[params.climate_anomaly_precip]
group = "environment"
unit = "1 per permil"
description = "Relative change of precipitation per unit of the climate_anomaly pack's index (#41): rain is multiplied by 1 + this x index, at least 0. 0: the century means alone."
kind = { type = "real", min = -2.0, max = 2.0 }
default = 0.15
prior = { dist = "uniform", lo = 0.0, hi = 0.3 }
status = "literature"
note = "In the 8.2 ka event (about -1 permil in NGRIP; Morrill et al. 2013a) the northern Aegean's precipitation fell by 17% on average (error 14%) and 27% at most (Tenaghi Philippon pollen, Pross et al. 2009), and an Aegean core's by 13% (error 35%); Europe's by about 20%. In the Levant and Anatolia speleothems turn dry (Soreq, Jeita, Sofular; Burstyn et al. 2019) and the Dead Sea falls (Migowski et al. 2006). No record there gives an amount. So 15% per permil, and a prior from none to 30%; the records of what people did judge it."
sources = [
  { citation = "Morrill, C., Anderson, D.M., Bauer, B.A., et al. (2013a). Proxy benchmarks for intercomparison of 8.2 ka simulations. Climate of the Past 9, 423-432.", doi = "10.5194/cp-9-423-2013" },
  { citation = "Pross, J., Kotthoff, U., Mueller, U.C., et al. (2009). Massive perturbation in terrestrial ecosystems of the Eastern Mediterranean region associated with the 8.2 kyr B.P. climatic event. Geology 37, 887-890.", doi = "10.1130/G25739A.1" },
  { citation = "Burstyn, Y., Martrat, B., Lopez, J.F., et al. (2019). Speleothems from the Middle East: an example of water limited environments in the SISAL database. Quaternary 2, 16.", doi = "10.3390/quat2020016" },
  { citation = "Migowski, C., Stein, M., Prasad, S., Negendank, J.F.W., Agnon, A. (2006). Holocene climate variability and cultural evolution in the Near East from the Dead Sea sedimentary record. Quaternary Research 66, 421-431.", doi = "10.1016/j.yqres.2006.06.010" },
]

[params.cultivation_crowding]
group = "cultivation"
unit = "N/K"
description = "Population pressure is the crowding (people over forager capacity) beyond this value, capped at 1."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 1.111
prior = { dist = "uniform", lo = 0.9, hi = 1.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 1 to 1.4 (10-90%). Above 1, foragers at equilibrium feel no pressure, and moving away absorbs small local overshoots; pressure comes when the climate cuts forager capacity or cultivation lets people outgrow it. Since any cultivation raises capacity, pressure then ratchets effort up (Rindos 1984)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Cohen, M.N. (1977). The Food Crisis in Prehistory: Overpopulation and the Origins of Agriculture. Yale University Press." },
]

[params.cultivation_pressure_weight]
group = "cultivation"
unit = "1"
description = "Population-pressure hypothesis: target cultivation effort per unit of pressure (crowding beyond cultivation_crowding, capped at 1)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.2592
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.028 to 0.55 (10-90%). Zero switches the hypothesis off; calibration weighs it against stress and abundance."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Binford, L.R. (1968). Post-Pleistocene adaptations. In Binford, S.R., Binford, L.R. (eds), New Perspectives in Archeology, 313-341. Aldine." },
  { citation = "Cohen, M.N. (1977). The Food Crisis in Prehistory: Overpopulation and the Origins of Agriculture. Yale University Press." },
]

[params.cultivation_stress_weight]
group = "cultivation"
unit = "1"
description = "Climate-stress hypothesis: target cultivation effort per unit of climate stress (the relative decline of forager capacity over stress_window_years)."
kind = { type = "real", min = 0.0, max = 10.0 }
default = 0.2
prior = { dist = "uniform", lo = 0.0, hi = 3.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.24 to 2.4 (10-90%). The Younger Dryas cut forager capacity by tens of percent; zero switches the hypothesis off."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Moore, A.M.T., Hillman, G.C. (1992). The Pleistocene to Holocene transition and human economy in Southwest Asia: the impact of the Younger Dryas. American Antiquity 57, 482-494.", doi = "10.2307/280936" },
  { citation = "Bar-Yosef, O. (1998). The Natufian culture in the Levant, threshold to the origins of agriculture. Evolutionary Anthropology 6, 159-177.", doi = "10.1002/(SICI)1520-6505(1998)6:5<159::AID-EVAN4>3.0.CO;2-7" },
]

[params.cultivation_abundance_weight]
group = "cultivation"
unit = "1"
description = "Abundance (niche-construction) hypothesis: target cultivation effort per unit of wild-cereal suitability, at any population density."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.122
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.097 to 0.77 (10-90%). Rich wild stands invite tending and sowing without stress."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Smith, B.D. (2007). Niche construction and the behavioral context of plant and animal domestication. Evolutionary Anthropology 16, 188-199.", doi = "10.1002/evan.20135" },
  { citation = "Zeder, M.A. (2016). Domestication as a model system for niche construction theory. Evolutionary Ecology 30, 325-348.", doi = "10.1007/s10682-015-9801-8" },
]

[params.cultivation_variability_weight]
group = "cultivation"
unit = "1/suitability per century"
description = "Stable-climate hypothesis: cultivation targets are multiplied by 1 - weight x climate variability (the mean change of wild-cereal suitability per century over the stress window), at least 0."
kind = { type = "real", min = 0.0, max = 50.0 }
default = 2.0
prior = { dist = "uniform", lo = 0.0, hi = 20.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 6.6 to 19 (10-90%). Zero switches the hypothesis off. Late-glacial climates swung too fast for sowing to pay; the Holocene made it possible. In the M1 forcing suitability changes about 0.08 per century before 9,000 BCE and 0.03 after. With decadal anomalies in the forcing (ADR-0107) the climate also swings from century to century as the record says it did (the Preboreal oscillation, the 9.3 and 8.2 ka events), and at 7.202 farming at sites like Abu Hureyra falls back to a third from 9,500 to 8,000 BCE; a profile at the calibrated defaults with the anomalies (calibration/runs/m1/anomaly/profile-variability-weight.json, three seeds each, every one consistent) fits the summaries best at 2 (-81.5, against -82.0 at 0, -83.5 at 4 and -83.2 at 7.202; -81.1 without the anomalies at 7.202), and the items better than before (-4,293.7 against -4,297.7), so it became 2: against real swings, the hypothesis needs a quarter of the weight."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Richerson, P.J., Boyd, R., Bettinger, R.L. (2001). Was agriculture impossible during the Pleistocene but mandatory during the Holocene? A climate change hypothesis. American Antiquity 66, 387-411.", doi = "10.2307/2694241" },
  { citation = "Bettinger, R., Richerson, P., Boyd, R. (2009). Constraints on the development of agriculture. Current Anthropology 50, 627-631.", doi = "10.1086/605359" },
  { citation = "ManyWorlds M1 profile with decadal climate anomalies (ADR-0107): calibration/runs/m1/anomaly/profile-variability-weight.json.", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/anomaly/profile-variability-weight.json" },
]

[params.stress_window_years]
group = "cultivation"
unit = "years"
description = "Climate stress compares forager capacity now with this many years earlier."
kind = { type = "integer", min = 10, max = 2000 }
default = 158
prior = { dist = "uniform", lo = 100.0, hi = 1000.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 212 to 786 (10-90%). Memory of better times over a few generations; climate slices are a century apart."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
]

[params.adoption_rate]
group = "cultivation"
unit = "1/period"
description = "Share of the gap between a band's cultivation effort and its target closed each period (social learning)."
kind = { type = "probability" }
default = 0.0284
prior = { dist = "log_uniform", lo = 0.005, hi = 0.2 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.0064 to 0.14 (10-90%). The rate at which a band learns when everyone around it plants; with innovation_share small it learns slowly while few do, so practices spread over generations."
sources = [
  { citation = "Henrich, J. (2001). Cultural transmission and the diffusion of innovations: adoption dynamics indicate that biased cultural transmission is the predominate force in behavioral change. American Anthropologist 103, 992-1013.", doi = "10.1525/aa.2001.103.4.992" },
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
]

[params.innovation_share]
group = "cultivation"
unit = "1"
description = "Share of a band's learning of cultivation that is its own (innovation), the rest learned from the people around it: the gap to the target closes at adoption_rate * (i + (1 - i) * seen), seen being the share of cultivation in what it sees: the people of its cell and, by neighbor_learning, of the cells around it, farmers weighted by how well farming pays (success_bias)."
kind = { type = "probability" }
default = 1.606e-05
prior = { dist = "log_uniform", lo = 0.00001, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 2.4e-05 to 0.19 (10-90%). 1 switches the hypothesis off (individual learning, the model before ADR-0065). Small shares make cultivation an innovation few have seen, which spreads slowly at first and then fast, an S-shaped adoption curve: Henrich (2001) reads such curves as the mark of biased cultural transmission, and Bass (1969) fits them as innovation plus imitation."
sources = [
  { citation = "Bass, F.M. (1969). A new product growth for model consumer durables. Management Science 15, 215-227.", doi = "10.1287/mnsc.15.5.215" },
  { citation = "Henrich, J. (2001). Cultural transmission and the diffusion of innovations: adoption dynamics indicate that biased cultural transmission is the predominate force in behavioral change. American Anthropologist 103, 992-1013.", doi = "10.1525/aa.2001.103.4.992" },
  { citation = "Ackland, G.J., Signitzer, M., Stratford, K., Cohen, M.H. (2007). Cultural hitchhiking on the wave of advance of beneficial technologies. PNAS 104, 8714-8719.", doi = "10.1073/pnas.0702469104" },
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
]

[params.neighbor_learning]
group = "cultivation"
unit = "1"
description = "Weight of each neighboring cell's people, relative to a band's own cell's, in what it learns cultivation from (ADR-0076). 0: bands learn from their own cell only (before ADR-0076)."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.1
prior = { dist = "uniform", lo = 0.0, hi = 0.5 }
status = "placeholder"
note = "Judgment: six neighbors at 0.1 make the people around a band's country count about half as much as its own. Forager bands are linked to others across a region by kinship, marriage and visiting, the mating networks of several hundred people that span many bands (Wobst 1974), so practice is seen beyond a band's own country; most interaction stays near home. To be calibrated."
sources = [
  { citation = "Wobst, H. M. (1974). Boundary conditions for Paleolithic social systems: a simulation approach. American Antiquity 39, 147-178.", doi = "10.2307/279579" },
]

[params.success_bias]
group = "cultivation"
unit = "1"
description = "Success (payoff) bias in learning cultivation (ADR-0076): each farmer a band sees counts as the payoff of farming, the people a unit of effort feeds against foraging's, to this power, and each forager as 1. 0: copying in proportion to how many do it (before ADR-0076); 1: in proportion to payoff (linear payoff weighting)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.2273
prior = { dist = "uniform", lo = 0.0, hi = 3.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.27 to 2.6 (10-90%). Not identified (open question 36): the records, the onset contrasts by wild-cereal stands included (ADR-0080), see its joint effect with adoption_rate and innovation_share on the pace of cultivation, not each one, so this is the chosen world's value, not a measurement. People copy the practices of those who visibly do well: payoff bias is among the best supported learning strategies in experiments (McElreath et al. 2008; Laland 2004) and success and prestige bias are central to dual-inheritance theory (Boyd and Richerson 1985; Henrich and Gil-White 2001). Judgment: 1 weights models linearly by payoff, a plain normalized weighting rather than any one estimated rule (learners here do not compare their own payoff with their models'). Early cultivation of wild cereals can feed fewer people per unit of effort than foraging and is then copied less; domestic crops make it pay."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Boyd, R., Richerson, P. J. (1985). Culture and the Evolutionary Process. University of Chicago Press." },
  { citation = "Henrich, J., Gil-White, F. J. (2001). The evolution of prestige: freely conferred deference as a mechanism for enhancing the benefits of cultural transmission. Evolution and Human Behavior 22, 165-196.", doi = "10.1016/S1090-5138(00)00071-4" },
  { citation = "McElreath, R., Bell, A. V., Efferson, C., et al. (2008). Beyond existence and aiming outside the laboratory: estimating frequency-dependent and pay-off-biased social learning strategies. Philosophical Transactions of the Royal Society B 363, 3515-3528.", doi = "10.1098/rstb.2008.0131" },
  { citation = "Laland, K. N. (2004). Social learning strategies. Learning and Behavior 32, 4-14.", doi = "10.3758/BF03196002" },
]

[params.selection_coefficient]
group = "cultivation"
unit = "1/period"
description = "Selection for domestic traits (e.g. non-shattering ears) under full cultivation effort, per crop generation (one per year)."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.009112
prior = { dist = "log_uniform", lo = 0.001, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.0035 to 0.0075 (10-90%). The prior spans the competing hypotheses: protracted domestication (s ~ 0.001-0.01 from the archaeobotanical record) and rapid domestication (s ~ 0.05-0.5 under sickle harvest and resowing in experiments)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Purugganan, M.D., Fuller, D.Q. (2011). Archaeological data reveal slow rates of evolution during plant domestication. Evolution 65, 171-183.", doi = "10.1111/j.1558-5646.2010.01093.x" },
  { citation = "Hillman, G.C., Davies, M.S. (1990). Measured domestication rates in wild wheats and barley under primitive cultivation, and their archaeological implications. Journal of World Prehistory 4, 157-222.", doi = "10.1007/BF00974763" },
]

[params.emmer_selection_ratio]
group = "cultivation"
unit = "1"
description = "Selection for domestic traits in emmer wheat, sown with the crop under the same effort, as a fraction of the crop's (barley's) selection_coefficient (#38)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.74
prior = { dist = "log_uniform", lo = 0.05, hi = 2.0 }
status = "literature"
note = "Allaby et al. (2017, Table S13) estimate early selection from the rachis record of each crop and region: in the southern Levant, 0.00068 per generation for emmer against 0.00091 for barley, a ratio of 0.74 (in the eastern Fertile Crescent emmer's is 0.0011, with no barley estimate there). Ratios rather than rates, as the record measures selection in fields whose effort the model sets, the same for every crop. Wide prior: each estimate rests on a few assemblages, and their 95% intervals span an order of magnitude."
sources = [
  { citation = "Allaby, R.G., Stevens, C., Lucas, L., Maeda, O., Fuller, D.Q. (2017). Geographic mosaics and changing rates of cereal domestication. Philosophical Transactions of the Royal Society B 372: 20160429 (Table S13).", doi = "10.1098/rstb.2016.0429" },
]

[params.einkorn_selection_ratio]
group = "cultivation"
unit = "1"
description = "Selection for domestic traits in einkorn wheat, sown with the crop under the same effort, as a fraction of the crop's (barley's) selection_coefficient (#38)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.9
prior = { dist = "log_uniform", lo = 0.05, hi = 2.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0101): with every other parameter at its calibrated default, the values from 0.5 to 1.1 are consistent with every record for three seeds, and 0.9 fits the summaries best (log-likelihood -83.0, against -83.7 at 1 and -83.4 at 0.8). The literature's 0.14 is not: einkorn then stays wild where the record has it mostly domestic by 7,600 BCE (Cafer Höyük, 46 of 57 ears). Allaby et al. (2017, Table S13) give 0.00053 per generation for einkorn at Qaramel against 0.0037 for barley at Jerf el-Ahmar, a ratio of 0.14 that rests on Qaramel's one early assemblage (10,275 cal BC, 18 fragments); the prior stays wide around it."
sources = [
  { citation = "ManyWorlds M1 calibration (ADR-0101): einkorn_selection_ratio from 0.14 to 1.5 with the other parameters at their calibrated defaults, three seeds each, calibration/runs/m1/round13/profile-einkorn-selection-ratio.json.", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round13/profile-einkorn-selection-ratio.json" },
  { citation = "Allaby, R.G., Stevens, C., Lucas, L., Maeda, O., Fuller, D.Q. (2017). Geographic mosaics and changing rates of cereal domestication. Philosophical Transactions of the Royal Society B 372: 20160429 (Table S13).", doi = "10.1098/rstb.2016.0429" },
]

[params.domestic_wild_frequency]
group = "cultivation"
unit = "1"
description = "Share of domestic-type plants in wild stands (the floor selection acts on)."
kind = { type = "probability" }
default = 0.006639
prior = { dist = "log_uniform", lo = 0.00001, hi = 0.01 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 3.2e-05 to 0.0061 (10-90%). Tough-rachis mutants are rare in wild stands; the order of magnitude is uncertain."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
