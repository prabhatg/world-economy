[params.obsidian_loss]
group = "exchange"
unit = "share per period"
description = "Share of obsidian used up or kept, not passed on, at each step of down-the-line exchange: away from its sources a cell's availability becomes (1 - loss) times the mean over itself and its occupied neighbors."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.009513
prior = { dist = "log_uniform", lo = 0.0003, hi = 0.1 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0081): one world consistent with the radiocarbon (region-wide and by subregion), rachis, site-count, village-size, obsidian, cultivation-onset (and by wild-cereal stands) and house-size records; consistent worlds span 0.0023 to 0.079 (10-90%). Sets how fast obsidian falls off with distance along settled land: one e-fold every 1.5 res-5 cells (25 km) at 0.1, 4.3 (74 km) at 0.01, 7.1 (121 km) at 0.003 and 10.6 (180 km) at 0.001; at small losses the network takes about 1/loss years to settle. Renfrew's contact zone falls off over a few hundred kilometres (ADR-0060)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 10 (ADR-0081): the consistent world whose summaries of the radiocarbon (region-wide and by subregion), barley rachis, survey site-count, village-size, obsidian sourcing, cultivation-onset (and by wild-cereal stands) and house-size records sit nearest the record, calibration/runs/m1/round10/best-wave6.json (wave 6, run 216).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round10/best-wave6.json" },
  { citation = "Renfrew, C., Dixon, J.E., Cann, J.R. (1966). Obsidian and early cultural contact in the Near East. Proceedings of the Prehistoric Society 32, 30-72.", doi = "10.1017/S0079497X0001433X" },
