# Parameter registry for the engine's mechanisms: the M0 toy mechanisms (growth, band
# fission, migration) and, from M1, foraging carrying capacity from forcing packs,
# forager dispersal, and cultivation and domestication.
#
# Every parameter declares its unit, valid range, calibration prior, status and
# sources. Status "placeholder" means an engine-test value with no empirical claim;
# M1 replaces these with literature-based or calibrated values.
# Status "calibrated" means the value of one world consistent with the M1 record
# (calibration/runs/m1/round8/best.json, ADR-0066); its note gives the consistent range.
#
# Changing a default changes the golden hash (engine/golden/m0-toy.json).

name = "m0-toy"
version = 4

[params.period_ticks]
group = "time"
unit = "days"
description = "Period of the growth and fission mechanisms."
kind = { type = "integer", min = 1, max = 3650 }
default = 365
prior = { dist = "fixed" }
status = "placeholder"
note = "Yearly steps suit slow prehistoric dynamics; finer periods arrive with seasonal mechanisms in M1."

[params.growth_rate]
group = "demography"
unit = "1/period"
description = "Intrinsic growth rate r in logistic growth dw = r w (1 - N/K) of mobile foragers (see sedentary_growth_rate)."
kind = { type = "real", min = 0.0, max = 0.1 }
default = 0.02316
prior = { dist = "uniform", lo = 0.001, hi = 0.03 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0038 to 0.027 (10-90%). Local growth of foragers between filling empty land and holding at capacity; the Neolithic demographic transition is sedentary_growth_rate. Not identified by the records (ADR-0067): populations follow carrying capacity, which grows far slower."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Bocquet-Appel, J.-P. (2011). When the world's population took off: the springboard of the Neolithic Demographic Transition. Science 333, 560-561.", doi = "10.1126/science.1208880" },
]

[params.sedentary_growth_rate]
group = "demography"
unit = "1/period"
description = "Intrinsic growth rate of fully sedentary cultivators; a band's rate moves linearly from growth_rate (mobile foragers) to this with its cultivation effort (the Neolithic demographic transition)."
kind = { type = "real", min = 0.0, max = 0.1 }
default = 0.02648
prior = { dist = "uniform", lo = 0.001, hi = 0.03 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0039 to 0.026 (10-90%). Sedentism and cereal weaning foods shorten birth intervals: fertility rises with dependence on cultivation, followed by higher child mortality, with net growth higher than foragers'. The records do not identify it (ADR-0067): populations follow carrying capacity, so the rate only sets a lag of a few percent, and a profile at the defaults from 0.1 to 4 times the forager rate is flat (calibration/runs/m1/round8/sedentary_growth_rate.json). The calibrated world has 1.1 times the forager rate, as one world among many; testing it needs age structure and the juvenile index (#33)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Bocquet-Appel, J.-P. (2002). Paleoanthropological traces of a Neolithic demographic transition. Current Anthropology 43, 637-650.", doi = "10.1086/342429" },
  { citation = "Bocquet-Appel, J.-P. (2011). When the world's population took off: the springboard of the Neolithic Demographic Transition. Science 333, 560-561.", doi = "10.1126/science.1208880" },
  { citation = "Sellen, D.W., Mace, R. (1997). Fertility and mode of subsistence: a phylogenetic analysis. Current Anthropology 38, 878-889.", doi = "10.1086/204677" },
  { citation = "Page, A.E. et al. (2016). Reproductive trade-offs in extant hunter-gatherers suggest adaptive mechanism for the Neolithic expansion. PNAS 113, 4694-4699.", doi = "10.1073/pnas.1524031113" },
]

[params.fertility]
group = "demography"
unit = "1/period"
description = "Crude birth rate of mobile foragers: births per person and period. Deaths are the rest of the logistic change, so births and deaths are gross vital events (see sedentary_fertility)."
kind = { type = "real", min = 0.0, max = 0.2 }
default = 0.0325
prior = { dist = "uniform", lo = 0.03, hi = 0.06 }
status = "literature"
note = "The birth rate of a stationary population with the average hunter-gatherer mortality of Gurven and Kaplan (2007, Table 2: Siler a1 0.422, b1 1.131, a2 0.013, a3 1.47e-4, b3 0.086), 1/e0 with e0 30.8 years. The prior starts at the top of growth_rate's: a population cannot grow faster than it bears children. Fertility 0 (with sedentary_fertility 0) is the growth before ADR-0068, the net change alone, rounded once: checkpoints from before it restore with it (ADR-0069)."
sources = [
  { citation = "Gurven, M., Kaplan, H. (2007). Longevity among hunter-gatherers: a cross-cultural examination. Population and Development Review 33, 321-365.", doi = "10.1111/j.1728-4457.2007.00171.x" },
]

[params.sedentary_fertility]
group = "demography"
unit = "1/period"
description = "Crude birth rate of fully sedentary cultivators; a band's moves linearly from fertility (mobile foragers) to this with its cultivation effort. The Neolithic demographic transition's signature in the skeletal record (juvenile index)."
kind = { type = "real", min = 0.0, max = 0.2 }
default = 0.0325
prior = { dist = "uniform", lo = 0.03, hi = 0.06 }
status = "placeholder"
note = "Equal to fertility: the no-transition hypothesis, nested. The juvenile index of cemeteries rises a few centuries after farming arrives (Bocquet-Appel 2002), read as a rise in fertility, so the literature fixes the sign, not the size; the Levant cemeteries (#33) are to calibrate it. At capacity it changes births and deaths, not numbers (ADR-0068)."
sources = [
  { citation = "Bocquet-Appel, J.-P. (2002). Paleoanthropological traces of a Neolithic demographic transition. Current Anthropology 43, 637-650.", doi = "10.1086/342429" },
]

[params.disease_threshold]
group = "health"
unit = "people"
description = "Critical size of a fully sedentary group for endemic infection (ADR-0075): with density-dependent transmission, R0 is the group's size over this, and in larger groups the infection persists at prevalence 1 - 1/R0 (Anderson and May 1991). Mobile groups' critical size is this over their contact (mobile_contact)."
kind = { type = "real", min = 1.0, max = 1000.0 }
default = 50.0
prior = { dist = "uniform", lo = 20.0, hi = 150.0 }
status = "placeholder"
note = "Judgment. Acute crowd infections (measles) need communities of hundreds of thousands (Bartlett 1957) and could not persist in the Neolithic; what small, settled communities sustain are infections spread through shared water, waste and close contact, and tuberculosis, found at Atlit-Yam about 7000 BCE (Hershkovitz et al. 2008). This is the burden settlement adds: isolated bands keep their own persistent infections (Black 1975), which foragers' baseline mortality already counts, so a camp's zero burden here is a modelling assumption. Below the sizes of farming villages (Fission's village_fission_size, 127) and above foragers' camps once mobility is counted. The skeletal record of infection in the Levant (Eshed et al. 2010) is to constrain it."
sources = [
  { citation = "Anderson, R. M., May, R. M. (1991). Infectious Diseases of Humans: Dynamics and Control. Oxford University Press.", doi = "10.1093/oso/9780198545996.001.0001" },
  { citation = "Bartlett, M. S. (1957). Measles periodicity and community size. Journal of the Royal Statistical Society A 120, 48-70.", doi = "10.2307/2342553" },
  { citation = "Black, F. L. (1975). Infectious diseases in primitive societies. Science 187, 515-518.", doi = "10.1126/science.163483" },
  { citation = "Hershkovitz, I., Donoghue, H. D., Minnikin, D. E., et al. (2008). Detection and molecular characterization of 9000-year-old Mycobacterium tuberculosis from a Neolithic settlement in the Eastern Mediterranean. PLoS ONE 3, e3426.", doi = "10.1371/journal.pone.0003426" },
  { citation = "Eshed, V., Gopher, A., Pinhasi, R., Hershkovitz, I. (2010). Paleopathology and the origin of agriculture in the Levant. American Journal of Physical Anthropology 143, 121-133.", doi = "10.1002/ajpa.21301" },
]

[params.mobile_contact]
group = "health"
unit = "share"
description = "Transmission among fully mobile foragers relative to sedentary villagers (ADR-0075): moving camp leaves waste, vermin and fouled water behind, and lets people act on disgust and avoid the sick. A group's contact moves linearly from this to 1 with its cultivation effort; its critical size for endemic infection is disease_threshold over its contact."
kind = { type = "probability" }
default = 0.4
prior = { dist = "uniform", lo = 0.1, hi = 1.0 }
status = "placeholder"
note = "Judgment, set so that foragers' camps at their size limit (fission_threshold, 60) stay below their critical size (125). Foragers move camp as refuse and pests build up (Kelly 2013), and sedentism ties people to their waste and water (Armelagos et al. 1991). Disgust is the behavioral immune system that drives avoidance (Schaller and Park 2011; Curtis et al. 2011); mobility is what lets foragers act on it. 1: mobility does not protect."
sources = [
  { citation = "Kelly, R. L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
  { citation = "Armelagos, G. J., Goodman, A. H., Jacobs, K. H. (1991). The origins of agriculture: population growth during a period of declining health. Population and Environment 13, 9-22.", doi = "10.1007/BF01256568" },
  { citation = "Schaller, M., Park, J. H. (2011). The behavioral immune system (and why it matters). Current Directions in Psychological Science 20, 99-103.", doi = "10.1177/0963721411402596" },
  { citation = "Curtis, V., de Barra, M., Aunger, R. (2011). Disgust as an adaptive system for disease avoidance behaviour. Philosophical Transactions of the Royal Society B 366, 389-401.", doi = "10.1098/rstb.2010.0117" },
]

[params.disease_mortality]
group = "health"
unit = "1/period"
description = "Deaths per infected person and period from endemic infection (ADR-0075), on top of the deaths of logistic growth. A group above its critical size loses this times the people above it (its infected, at the endemic equilibrium). 0: no disease (before ADR-0075)."
kind = { type = "real", min = 0.0, max = 0.1 }
default = 0.005
prior = { dist = "uniform", lo = 0.0, hi = 0.02 }
status = "placeholder"
note = "Judgment: in the largest villages (127 people, prevalence 0.61 at the default critical size) about 0.3% of people a year, a tenth of the crude death rate (fertility, 0.0325), for chronic infection that burdens more than it kills. Neolithic skeletons in the southern Levant show more lesions of infection than Natufian ones, which Eshed et al. (2010) relate to larger, denser settlements; health declined as population grew (Armelagos et al. 1991). The prior starts at 0, no disease."
sources = [
  { citation = "Eshed, V., Gopher, A., Pinhasi, R., Hershkovitz, I. (2010). Paleopathology and the origin of agriculture in the Levant. American Journal of Physical Anthropology 143, 121-133.", doi = "10.1002/ajpa.21301" },
  { citation = "Armelagos, G. J., Goodman, A. H., Jacobs, K. H. (1991). The origins of agriculture: population growth during a period of declining health. Population and Environment 13, 9-22.", doi = "10.1007/BF01256568" },
]

[params.capacity_min]
group = "environment"
unit = "people per cell"
description = "Lower bound of the toy carrying capacity drawn per cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 20
prior = { dist = "fixed" }
status = "placeholder"
note = "Toy environment; M1 derives carrying capacity from climate, soils and biomes."

[params.capacity_max]
group = "environment"
unit = "people per cell"
description = "Upper bound of the toy carrying capacity drawn per cell."
kind = { type = "integer", min = 1, max = 100000 }
default = 400
prior = { dist = "fixed" }
status = "placeholder"
note = "Toy environment; M1 derives carrying capacity from climate, soils and biomes."

[params.fission_threshold]
group = "social"
unit = "people"
description = "Bands at least this large may split."
kind = { type = "integer", min = 2, max = 10000 }
default = 60
prior = { dist = "uniform", lo = 30.0, hi = 150.0 }
status = "placeholder"
note = "About twice a typical forager residential group size. The size limit of mobile foragers' camps; sedentary cultivators' rises to village_fission_size (scalar stress, ADR-0070)."
sources = [
  { citation = "Marlowe, F. W. (2005). Hunter-gatherers and human evolution. Evolutionary Anthropology 14, 54-67.", doi = "10.1002/evan.20046" },
]

[params.village_fission_size]
group = "social"
unit = "people"
description = "Size limit of a fully sedentary farming village: a group's limit rises from fission_threshold (mobile foragers) to this with its cultivation effort, in proportion (log-linear), and a group above its limit may split (scalar stress). 0: no villages, the fission before ADR-0070 (one limit, daughters placed by crowding whether or not their cell has room)."
kind = { type = "integer", min = 0, max = 10000 }
default = 127
prior = { dist = "uniform", lo = 100.0, hi = 300.0 }
status = "literature"
note = "Scalar stress: decisions among more than about six units overload a group, which then splits or builds hierarchy (Johnson 1982). Fissioning of Hutterite colonies, farming communities without such hierarchy, reaches probability 0.5 at 127 people (95% CI 122-132) and 0.99 at 158 (Alberti 2014), a fit that holds for early villages of the Titicaca basin and elsewhere; Kosse (1990) puts the first threshold of face-to-face communities between 100 and 200. The prior spans that range and the larger early villages Alberti tested (to 277)."
sources = [
  { citation = "Alberti, G. (2014). Modeling group size and scalar stress by logistic regression from an archaeological perspective. PLoS ONE 9, e91510.", doi = "10.1371/journal.pone.0091510" },
  { citation = "Kosse, K. (1990). Group size and societal complexity: thresholds in the long-term memory. Journal of Anthropological Archaeology 9, 275-303.", doi = "10.1016/0278-4165(90)90009-3" },
  { citation = "Johnson, G. A. (1982). Organizational structure and scalar stress. In C. Renfrew, M. Rowlands and B. A. Segraves (eds.), Theory and Explanation in Archaeology, 389-421. Academic Press." },
]

[params.aggregation_rate]
group = "social"
unit = "probability per period"
description = "Probability per period that a fully sedentary group joins the largest village of its cell, if the joined village stays within its scalar-stress size limit; it scales with the group's cultivation effort, so mobile foragers never join. 0: no aggregation (before ADR-0071)."
kind = { type = "probability" }
default = 0.05
prior = { dist = "uniform", lo = 0.0, hi = 0.2 }
status = "placeholder"
note = "Settled farmers drew together into villages for defence, exchange, marriage partners and shared ritual (Kuijt 2000), and are drawn to the larger community; what stops them is the scalar-stress limit of face-to-face coordination (Johnson 1982), the social-brain group size of about 150 (Dunbar 1993). A join within about twenty years of settling; the rate is to be calibrated."
sources = [
  { citation = "Kuijt, I. (2000). People and space in early agricultural villages: exploring daily lives, community size, and architecture in the late Pre-Pottery Neolithic. Journal of Anthropological Archaeology 19, 75-102.", doi = "10.1006/jaar.1999.0352" },
  { citation = "Dunbar, R. I. M. (1993). Coevolution of neocortical size, group size and language in humans. Behavioral and Brain Sciences 16, 681-694.", doi = "10.1017/S0140525X00032325" },
]

[params.wealth_transmission]
group = "social"
unit = "per generation"
description = "Intergenerational transmission of household wealth where land is not owned (foragers, and farmers whose land is open around them): the regression of a household's log wealth on its parents' (beta, Borgerhoff Mulder et al. 2009 eq. 1). Inequality within a group (ADR-0074) moves from this toward landed_wealth_transmission with its ownership of land: its cultivation effort times how closed in its land is."
kind = { type = "probability" }
default = 0.19
prior = { dist = "uniform", lo = 0.05, hi = 0.35 }
status = "literature"
note = "Hunter-gatherers' importance-weighted average beta over embodied, relational and material wealth, 0.19 +- 0.05 (Borgerhoff Mulder et al. 2009, Table 2); horticulturalists' is 0.18 +- 0.04, as low: cultivating alone does not make wealth heritable. Low transmission reflects egalitarian norms of sharing and levelling (Woodburn 1982; Boehm 1993). The prior spans three standard errors."
sources = [
  { citation = "Borgerhoff Mulder, M., Bowles, S., Hertz, T., et al. (2009). Intergenerational wealth transmission and the dynamics of inequality in small-scale societies. Science 326, 682-688.", doi = "10.1126/science.1178336" },
  { citation = "Woodburn, J. (1982). Egalitarian societies. Man 17, 431-451.", doi = "10.2307/2801707" },
  { citation = "Boehm, C. (1993). Egalitarian behavior and reverse dominance hierarchy. Current Anthropology 34, 227-254.", doi = "10.1086/204166" },
]

[params.wealth_shock]
group = "social"
unit = "variance of log wealth per generation"
description = "Variance of the chance shocks to household log wealth per generation (sigma^2, Borgerhoff Mulder et al. 2009 eq. 2) where land is not owned: illness, luck in the hunt or harvest, accidents. With wealth_transmission it sets the inequality foragers settle at, shock / (1 - transmission^2)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.1957
prior = { dist = "uniform", lo = 0.1, hi = 0.3 }
status = "literature"
note = "Derived: the shock that gives hunter-gatherers' Gini of 0.25 +- 0.04 (Borgerhoff Mulder et al. 2009, Table 2) at transmission 0.19 under lognormal wealth (stationary log variance 0.2031). The prior spans Ginis of about 0.18-0.31."
sources = [
  { citation = "Borgerhoff Mulder, M., Bowles, S., Hertz, T., et al. (2009). Intergenerational wealth transmission and the dynamics of inequality in small-scale societies. Science 326, 682-688.", doi = "10.1126/science.1178336" },
]

[params.landed_wealth_transmission]
group = "social"
unit = "per generation"
description = "Intergenerational transmission of household wealth where farmland is owned: farmed by the group and closed in by farmed land, sea or desert, so land is property and inherited (ADR-0074). See wealth_transmission."
kind = { type = "probability" }
default = 0.36
prior = { dist = "uniform", lo = 0.2, hi = 0.6 }
status = "literature"
note = "Agriculturalists' importance-weighted average beta, 0.36 +- 0.05 (Borgerhoff Mulder et al. 2009, Table 2; land alone 0.45, material wealth 0.55). Land becomes property where it is scarce and defensible (Demsetz 1967; Bowles and Choi 2013) and where people cannot move away from those who claim it (circumscription, Carneiro 1970)."
sources = [
  { citation = "Borgerhoff Mulder, M., Bowles, S., Hertz, T., et al. (2009). Intergenerational wealth transmission and the dynamics of inequality in small-scale societies. Science 326, 682-688.", doi = "10.1126/science.1178336" },
  { citation = "Bowles, S., Choi, J.-K. (2013). Coevolution of farming and private property during the early Holocene. Proceedings of the National Academy of Sciences 110, 8830-8835.", doi = "10.1073/pnas.1212149110" },
  { citation = "Carneiro, R. L. (1970). A theory of the origin of the state. Science 169, 733-738.", doi = "10.1126/science.169.3947.733" },
]

[params.landed_wealth_shock]
group = "social"
unit = "variance of log wealth per generation"
description = "Variance of the chance shocks to household log wealth per generation where farmland is owned (see wealth_shock): harvest failure, loss of stores and herds, partible inheritance."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.7205
prior = { dist = "uniform", lo = 0.45, hi = 1.0 }
status = "literature"
note = "Derived: the shock that gives agriculturalists' Gini of 0.48 +- 0.04 (Borgerhoff Mulder et al. 2009, Table 2) at transmission 0.36 under lognormal wealth (stationary log variance 0.8278). The prior spans Ginis of about 0.40-0.55."
sources = [
  { citation = "Borgerhoff Mulder, M., Bowles, S., Hertz, T., et al. (2009). Intergenerational wealth transmission and the dynamics of inequality in small-scale societies. Science 326, 682-688.", doi = "10.1126/science.1178336" },
]

[params.generation_years]
group = "social"
unit = "years"
description = "Length of a generation, over which wealth_transmission and the shocks act; inequality is updated every period by the equivalent fraction of a generation."
kind = { type = "real", min = 10.0, max = 50.0 }
default = 28.0
prior = { dist = "uniform", lo = 20.0, hi = 35.0 }
status = "placeholder"
note = "A human generation of about 25-32 years, women's shorter than men's; the cross-cultural estimates of Fenner (2005) are to be checked against the paper. Inequality approaches its level within a few decades, far faster than the records resolve, so little depends on it."
sources = [
  { citation = "Fenner, J. N. (2005). Cross-cultural estimation of the human generation interval for use in genetics-based population divergence studies. American Journal of Physical Anthropology 128, 415-423.", doi = "10.1002/ajpa.20188" },
]

[params.fission_probability]
group = "social"
unit = "probability per period"
description = "Probability that an eligible band splits in one period."
kind = { type = "probability" }
default = 0.2
prior = { dist = "uniform", lo = 0.05, hi = 0.5 }
status = "placeholder"
note = "Engine-test value."

[params.exploration_probability]
group = "migration"
unit = "probability"
description = "Probability that a daughter band moves to a random neighbor instead of the least crowded one."
kind = { type = "probability" }
default = 0.3
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "placeholder"
note = "Engine-test value."

[params.merge_threshold]
group = "resolution"
unit = "people"
description = "Agents smaller than this merge with other small agents in their cell (super-individual resolution control)."
kind = { type = "integer", min = 0, max = 1000 }
default = 10
prior = { dist = "fixed" }
status = "placeholder"
note = "Numerical resolution setting, not a behavioral claim."

[params.initial_bands]
group = "initial"
unit = "bands"
description = "Number of bands placed around the seed-chosen start cell (worlds without a climate pack, or with initial_occupancy 0)."
kind = { type = "integer", min = 1, max = 100000 }
default = 12
prior = { dist = "fixed" }
status = "placeholder"
note = "Engine-test value; M1 starts from reconstructed late-Pleistocene population estimates."

[params.initial_weight]
group = "initial"
unit = "people"
description = "People per initial band."
kind = { type = "integer", min = 1, max = 1000 }
default = 30
prior = { dist = "fixed" }
status = "placeholder"
note = "Close to typical forager residential group sizes."
sources = [
  { citation = "Marlowe, F. W. (2005). Hunter-gatherers and human evolution. Evolutionary Anthropology 14, 54-67.", doi = "10.1002/evan.20046" },
]

[params.initial_occupancy]
group = "initial"
unit = "N/K"
description = "Worlds with a climate pack start with one forager band in every habitable cell at this share of its forager capacity (0: start from initial_bands instead)."
kind = { type = "probability" }
default = 0.5
prior = { dist = "uniform", lo = 0.2, hi = 1.0 }
status = "placeholder"
note = "Epipaleolithic foragers (Kebaran, Natufian, Zarzian) lived across Southwest Asia by 12,000 BCE; how close to capacity is uncertain and calibrated."
sources = [
  { citation = "Bar-Yosef, O. (1998). The Natufian culture in the Levant, threshold to the origins of agriculture. Evolutionary Anthropology 6, 159-177.", doi = "10.1002/(SICI)1520-6505(1998)6:5<159::AID-EVAN4>3.0.CO;2-7" },
]

# Forager dispersal (ADR-0048): bands in crowded cells bud off into less crowded
# neighbors, the wave of advance by which foragers fill a landscape.

[params.dispersal_crowding]
group = "migration"
unit = "N/K"
description = "Bands disperse only from cells at least this crowded (population over carrying capacity)."
kind = { type = "real", min = 0.0, max = 2.0 }
default = 0.5007
prior = { dist = "uniform", lo = 0.5, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.56 to 0.94 (10-90%). Foragers move before resources are exhausted; the threshold is calibrated against dispersal speed."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.dispersal_probability]
group = "migration"
unit = "probability per period"
description = "Probability that a band in a crowded cell sends a group to a less crowded neighbor in one period."
kind = { type = "probability" }
default = 0.3026
prior = { dist = "log_uniform", lo = 0.01, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.015 to 0.32 (10-90%). Sets the diffusion rate of the wave of advance (speed ~ 2 sqrt(r D)); calibrated against dated expansion fronts."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Ammerman, A.J., Cavalli-Sforza, L.L. (1984). The Neolithic Transition and the Genetics of Populations in Europe. Princeton University Press.", doi = "10.1515/9781400853113" },
]

[params.dispersal_fraction]
group = "migration"
unit = "1"
description = "Share of a dispersing band that leaves (the rest stays)."
kind = { type = "probability" }
default = 0.5
prior = { dist = "uniform", lo = 0.2, hi = 0.8 }
status = "placeholder"
note = "Budding: part of a group founds a new territory while the rest keeps the old one."

# Foraging carrying capacity (ADR-0047): used by worlds with a climate pack; toy worlds
# keep capacity_min/capacity_max.

[params.capacity_period_ticks]
group = "time"
unit = "days"
description = "How often carrying capacity is recomputed from the climate (which changes over centuries)."
kind = { type = "integer", min = 1, max = 36500 }
default = 3650
prior = { dist = "fixed" }
status = "placeholder"
note = "Ten years: well below the 100-year climate slices, and cheap enough to leave the step cost unchanged."

[params.miami_npp_max]
group = "foraging"
unit = "g dry matter m-2 yr-1"
description = "Miami model: asymptotic net primary productivity of the temperature and precipitation limits."
kind = { type = "real", min = 1.0, max = 10000.0 }
default = 3000.0
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_temp_offset]
group = "foraging"
unit = "1"
description = "Miami model temperature limit: NPP_T = max / (1 + exp(offset - slope T))."
kind = { type = "real", min = -10.0, max = 10.0 }
default = 1.315
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_temp_slope]
group = "foraging"
unit = "1/degC"
description = "Miami model temperature limit: slope on annual mean temperature."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.119
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.miami_precip_slope]
group = "foraging"
unit = "1/mm"
description = "Miami model precipitation limit: NPP_P = max (1 - exp(-slope P)), P in mm per year."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.000664
prior = { dist = "fixed" }
status = "literature"
sources = [
  { citation = "Lieth, H. (1975). Modeling the primary productivity of the world. In Lieth, H., Whittaker, R.H. (eds), Primary Productivity of the Biosphere, Ecological Studies 14, 237-263. Springer.", doi = "10.1007/978-3-642-80913-2_12" },
]

[params.npp_reference]
group = "foraging"
unit = "g dry matter m-2 yr-1"
description = "Productivity at which foragers live at forager_density_ref."
kind = { type = "real", min = 1.0, max = 5000.0 }
default = 1000.0
prior = { dist = "fixed" }
status = "placeholder"
note = "A normalizing constant (temperate woodland productivity); calibration moves forager_density_ref instead."

[params.forager_density_ref]
group = "foraging"
unit = "people/km2"
description = "Forager population density at the reference productivity, without aquatic resources."
kind = { type = "real", min = 0.001, max = 5.0 }
default = 0.2598
prior = { dist = "log_uniform", lo = 0.02, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.029 to 0.39 (10-90%). Ethnographic terrestrial forager densities mostly fall between ~0.01 and ~1 person/km2; calibrated against radiocarbon density."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
  { citation = "Kelly, R.L. (2013). The Lifeways of Hunter-Gatherers: The Foraging Spectrum. Cambridge University Press.", doi = "10.1017/CBO9781139176132" },
]

[params.npp_elasticity]
group = "foraging"
unit = "1"
description = "Elasticity of forager density with respect to net primary productivity: density = ref (NPP / NPP_ref)^elasticity."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 1.371
prior = { dist = "uniform", lo = 0.5, hi = 1.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.59 to 1.4 (10-90%). Forager density rises with productivity across ethnographic groups; the exponent is uncertain and calibrated."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Tallavaara, M., Eronen, J.T., Luoto, M. (2018). Productivity, biodiversity, and pathogens influence the global hunter-gatherer population density. PNAS 115, 1232-1237.", doi = "10.1073/pnas.1715638115" },
]

[params.aquatic_bonus]
group = "foraging"
unit = "1"
description = "Forager density added where a perennial river, a lake shore or a sea coast is at hand, as a multiple of forager_density_ref (independent of local productivity)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.5
prior = { dist = "uniform", lo = 0.0, hi = 1.5 }
status = "placeholder"
note = "Foragers with aquatic resources reach higher densities, also in deserts (the Nile valley); magnitude to be calibrated."
sources = [
  { citation = "Binford, L.R. (2001). Constructing Frames of Reference: An Analytical Method for Archaeological Theory Building Using Ethnographic and Environmental Data Sets. University of California Press." },
]

[params.perennial_discharge]
group = "foraging"
unit = "m3/s"
description = "Least long-term mean discharge for a river to count as a perennial aquatic resource."
kind = { type = "real", min = 0.0, max = 1000.0 }
default = 1.0
prior = { dist = "fixed" }
status = "placeholder"
note = "Matches the hydrology pack's threshold for river_length (wadis excluded)."

# Cultivation and domestication (ADR-0049): bands shift effort into cultivating wild
# cereals, driven by population pressure, climate stress or abundance (competing
# hypotheses nested as weights: set the others to zero to run one alone); cultivation
# selects for domestic traits, slowly or quickly (competing hypotheses as the range of
# selection_coefficient); domestic crops raise carrying capacity. Used by worlds with a
# climate pack; toy worlds never cultivate.

[params.cultivation_crowding]
group = "cultivation"
unit = "N/K"
description = "Population pressure is the crowding (people over forager capacity) beyond this value, capped at 1."
kind = { type = "real", min = 0.0, max = 3.0 }
default = 1.2
prior = { dist = "uniform", lo = 0.9, hi = 1.5 }
status = "placeholder"
note = "Above 1, foragers at equilibrium feel no pressure, and moving away absorbs small local overshoots; pressure comes when the climate cuts forager capacity or cultivation lets people outgrow it. Since any cultivation raises capacity, pressure then ratchets effort up (Rindos 1984)."
sources = [
  { citation = "Cohen, M.N. (1977). The Food Crisis in Prehistory: Overpopulation and the Origins of Agriculture. Yale University Press." },
]

[params.cultivation_pressure_weight]
group = "cultivation"
unit = "1"
description = "Population-pressure hypothesis: target cultivation effort per unit of pressure (crowding beyond cultivation_crowding, capped at 1)."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.4522
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.04 to 0.57 (10-90%). Zero switches the hypothesis off; calibration weighs it against stress and abundance."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Binford, L.R. (1968). Post-Pleistocene adaptations. In Binford, S.R., Binford, L.R. (eds), New Perspectives in Archeology, 313-341. Aldine." },
  { citation = "Cohen, M.N. (1977). The Food Crisis in Prehistory: Overpopulation and the Origins of Agriculture. Yale University Press." },
]

[params.cultivation_stress_weight]
group = "cultivation"
unit = "1"
description = "Climate-stress hypothesis: target cultivation effort per unit of climate stress (the relative decline of forager capacity over stress_window_years)."
kind = { type = "real", min = 0.0, max = 10.0 }
default = 1.0
prior = { dist = "uniform", lo = 0.0, hi = 3.0 }
status = "placeholder"
note = "The Younger Dryas cut forager capacity by tens of percent; zero switches the hypothesis off."
sources = [
  { citation = "Moore, A.M.T., Hillman, G.C. (1992). The Pleistocene to Holocene transition and human economy in Southwest Asia: the impact of the Younger Dryas. American Antiquity 57, 482-494.", doi = "10.2307/280936" },
  { citation = "Bar-Yosef, O. (1998). The Natufian culture in the Levant, threshold to the origins of agriculture. Evolutionary Anthropology 6, 159-177.", doi = "10.1002/(SICI)1520-6505(1998)6:5<159::AID-EVAN4>3.0.CO;2-7" },
]

[params.cultivation_abundance_weight]
group = "cultivation"
unit = "1"
description = "Abundance (niche-construction) hypothesis: target cultivation effort per unit of wild-cereal suitability, at any population density."
kind = { type = "real", min = 0.0, max = 5.0 }
default = 0.2787
prior = { dist = "uniform", lo = 0.0, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.11 to 0.75 (10-90%). Rich wild stands invite tending and sowing without stress."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Smith, B.D. (2007). Niche construction and the behavioral context of plant and animal domestication. Evolutionary Anthropology 16, 188-199.", doi = "10.1002/evan.20135" },
  { citation = "Zeder, M.A. (2016). Domestication as a model system for niche construction theory. Evolutionary Ecology 30, 325-348.", doi = "10.1007/s10682-015-9801-8" },
]

[params.cultivation_variability_weight]
group = "cultivation"
unit = "1/suitability per century"
description = "Stable-climate hypothesis: cultivation targets are multiplied by 1 - weight x climate variability (the mean change of wild-cereal suitability per century over the stress window), at least 0."
kind = { type = "real", min = 0.0, max = 50.0 }
default = 15.18
prior = { dist = "uniform", lo = 0.0, hi = 20.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 4.3 to 19 (10-90%). Zero switches the hypothesis off. Late-glacial climates swung too fast for sowing to pay; the Holocene made it possible. In the M1 forcing suitability changes about 0.08 per century before 9,000 BCE and 0.03 after."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Richerson, P.J., Boyd, R., Bettinger, R.L. (2001). Was agriculture impossible during the Pleistocene but mandatory during the Holocene? A climate change hypothesis. American Antiquity 66, 387-411.", doi = "10.2307/2694241" },
  { citation = "Bettinger, R., Richerson, P., Boyd, R. (2009). Constraints on the development of agriculture. Current Anthropology 50, 627-631.", doi = "10.1086/605359" },
]

[params.stress_window_years]
group = "cultivation"
unit = "years"
description = "Climate stress compares forager capacity now with this many years earlier."
kind = { type = "integer", min = 10, max = 2000 }
default = 300
prior = { dist = "uniform", lo = 100.0, hi = 1000.0 }
status = "placeholder"
note = "Memory of better times over about ten generations; climate slices are a century apart."

[params.adoption_rate]
group = "cultivation"
unit = "1/period"
description = "Share of the gap between a band's cultivation effort and its target closed each period (social learning)."
kind = { type = "probability" }
default = 0.0104
prior = { dist = "log_uniform", lo = 0.005, hi = 0.2 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0083 to 0.15 (10-90%). The rate at which a band learns when everyone around it plants; with innovation_share small it learns slowly while few do, so practices spread over generations."
sources = [
  { citation = "Henrich, J. (2001). Cultural transmission and the diffusion of innovations: adoption dynamics indicate that biased cultural transmission is the predominate force in behavioral change. American Anthropologist 103, 992-1013.", doi = "10.1525/aa.2001.103.4.992" },
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
]

[params.innovation_share]
group = "cultivation"
unit = "1"
description = "Share of a band's learning of cultivation that is its own (innovation), the rest learned from the people around it: the gap to the target closes at adoption_rate * (i + (1 - i) * seen), seen being the mean cultivation effort of the people in its cell."
kind = { type = "probability" }
default = 0.006066
prior = { dist = "log_uniform", lo = 0.00001, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 5.2e-05 to 0.48 (10-90%). 1 switches the hypothesis off (individual learning, the model before ADR-0065). Small shares make cultivation an innovation few have seen, which spreads slowly at first and then fast, an S-shaped adoption curve: Henrich (2001) reads such curves as the mark of biased cultural transmission, and Bass (1969) fits them as innovation plus imitation."
sources = [
  { citation = "Bass, F.M. (1969). A new product growth for model consumer durables. Management Science 15, 215-227.", doi = "10.1287/mnsc.15.5.215" },
  { citation = "Henrich, J. (2001). Cultural transmission and the diffusion of innovations: adoption dynamics indicate that biased cultural transmission is the predominate force in behavioral change. American Anthropologist 103, 992-1013.", doi = "10.1525/aa.2001.103.4.992" },
  { citation = "Ackland, G.J., Signitzer, M., Stratford, K., Cohen, M.H. (2007). Cultural hitchhiking on the wave of advance of beneficial technologies. PNAS 104, 8714-8719.", doi = "10.1073/pnas.0702469104" },
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
]

[params.selection_coefficient]
group = "cultivation"
unit = "1/period"
description = "Selection for domestic traits (e.g. non-shattering ears) under full cultivation effort, per crop generation (one per year)."
kind = { type = "real", min = 0.0, max = 1.0 }
default = 0.00646
prior = { dist = "log_uniform", lo = 0.001, hi = 0.5 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.0028 to 0.0086 (10-90%). The prior spans the competing hypotheses: protracted domestication (s ~ 0.001-0.01 from the archaeobotanical record) and rapid domestication (s ~ 0.05-0.5 under sickle harvest and resowing in experiments)."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Purugganan, M.D., Fuller, D.Q. (2011). Archaeological data reveal slow rates of evolution during plant domestication. Evolution 65, 171-183.", doi = "10.1111/j.1558-5646.2010.01093.x" },
  { citation = "Hillman, G.C., Davies, M.S. (1990). Measured domestication rates in wild wheats and barley under primitive cultivation, and their archaeological implications. Journal of World Prehistory 4, 157-222.", doi = "10.1007/BF00974763" },
]

[params.domestic_wild_frequency]
group = "cultivation"
unit = "1"
description = "Share of domestic-type plants in wild stands (the floor selection acts on)."
kind = { type = "probability" }
default = 0.00001548
prior = { dist = "log_uniform", lo = 0.00001, hi = 0.01 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 1.7e-05 to 0.005 (10-90%). Tough-rachis mutants are rare in wild stands; the order of magnitude is uncertain."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Hillman, G.C., Davies, M.S. (1990). Measured domestication rates in wild wheats and barley under primitive cultivation, and their archaeological implications. Journal of World Prehistory 4, 157-222.", doi = "10.1007/BF00974763" },
]

[params.introgression_rate]
group = "cultivation"
unit = "1/period"
description = "Pull of a band's crop back toward the wild type, per unit of effort not spent cultivating (gene flow from wild stands, abandoned fields)."
kind = { type = "probability" }
default = 0.0003676
prior = { dist = "log_uniform", lo = 0.0001, hi = 0.01 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 1.3e-04 to 0.0016 (10-90%). Gene flow from wild populations is why the protracted model predicts slow domestication; with it, light cultivation never domesticates."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Allaby, R.G., Fuller, D.Q., Brown, T.A. (2008). The genetic expectations of a protracted model for the origins of domesticated crops. PNAS 105, 13982-13986.", doi = "10.1073/pnas.0803780105" },
]

[params.farm_density]
group = "cultivation"
unit = "people/km2"
description = "People fed per km2 of dry land under full cultivation of domestic crops where wild cereals grow best."
kind = { type = "real", min = 0.01, max = 100.0 }
default = 3.639
prior = { dist = "log_uniform", lo = 0.5, hi = 10.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.66 to 7.1 (10-90%). Regional densities of early farmers were around one to a few people per km2, an order of magnitude above foragers."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Zimmermann, A., Hilpert, J., Wendt, K.P. (2009). Estimations of population density for selected periods between the Neolithic and AD 1800. Human Biology 81, 357-380.", doi = "10.3378/027.081.0313" },
]

[params.wild_yield_ratio]
group = "cultivation"
unit = "1"
description = "Yield of cultivated wild cereals relative to domestic ones (shattering loses grain before harvest)."
kind = { type = "probability" }
default = 0.3877
prior = { dist = "uniform", lo = 0.2, hi = 1.0 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 0.27 to 0.91 (10-90%). Wild stands yield well when harvested at the right time; early cultivation was not more productive than foraging per hour of work."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Bowles, S. (2011). Cultivation of cereals by the first farmers was not more productive than foraging. PNAS 108, 4760-4765.", doi = "10.1073/pnas.1010733108" },
  { citation = "Hillman, G.C., Davies, M.S. (1990). Measured domestication rates in wild wheats and barley under primitive cultivation, and their archaeological implications. Journal of World Prehistory 4, 157-222.", doi = "10.1007/BF00974763" },
]

[params.soil_erosion_rate]
group = "cultivation"
unit = "soil share per year at full effort"
description = "Land-degradation hypothesis: share of a cell's erodible soil lost per year under full cultivation effort (in proportion to effort)."
kind = { type = "real", min = 0.0, max = 0.01 }
default = 0.0002059
prior = { dist = "uniform", lo = 0.0, hi = 0.001 }
status = "calibrated"
note = "Calibrated on M1 (ADR-0066): one world consistent with the radiocarbon, rachis, site-count, obsidian and cultivation-onset records; consistent worlds span 2.9e-05 to 7.2e-04 (10-90%). Zero switches the hypothesis off. Tilled land erodes one to two orders of magnitude faster than soil forms (about 1 mm/yr against 0.01-0.1 mm/yr); hoe and sickle farming of thin Mediterranean soils loses tens of centimetres over millennia: 1e-4 to 1e-3 of the erodible depth per year."
sources = [
  { citation = "ManyWorlds M1 calibration, round 8 (ADR-0066): the consistent world whose summaries of the radiocarbon, barley rachis, survey site-count, obsidian sourcing and cultivation-onset records sit nearest the record, calibration/runs/m1/round8/best.json (wave 9, run 180).", url = "https://github.com/prabhatg/world-economy/blob/main/calibration/runs/m1/round8/best.json" },
  { citation = "Montgomery, D.R. (2007). Soil erosion and agricultural sustainability. PNAS 104, 13268-13272.", doi = "10.1073/pnas.0611508104" },
