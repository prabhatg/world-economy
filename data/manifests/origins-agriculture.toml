# Archaeobotany of the Pre-Pottery Neolithic and earlier: plant remains per sample of dated
# site phases in southwest Asia, central Anatolia and Cyprus.
dataset = "origins-agriculture"
title = "Origins of agriculture: archaeobotanical database"
version = "2018"
homepage = "https://doi.org/10.5284/1046750"
citation = "Wallace, M., Livarda, A., Charles, M., Jones, G. (2018). Origins of agriculture: archaeobotanical database (data-set). York: Archaeology Data Service (distributor). https://doi.org/10.5284/1046750"
doi = "10.5284/1046750"
notes = """
Compiled from published sources for Wallace et al. (2019, Vegetation History and
Archaeobotany 28: 449-463, doi:10.1007/s00334-018-0702-y), building on Sue Colledge's
database for the AHRB project 'The Origin and Spread of Neolithic Plant Economies in the
Near East and Europe' (PIs Shennan and Conolly) and the NERC 'Domestication of Europe'
project (PI Brown). Funded by the ERC ('The Evolutionary Origins of Agriculture',
269830-EOA, PI Jones) and NERC ('Origins of Agriculture: an Ecological Perspective on
Crop Domestication', NE/H022716/1, PI Osborne). Each phase carries approximate start and
end years BC and a period; each taxon is classed as a domesticate, a crop progenitor or
wild. The original publications of each sample (tables 3 and 4) are to be cited with it.
"""

