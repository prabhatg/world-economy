# Lesions of infection in Natufian and Neolithic skeletons of the southern Levant: how
# common infection was before and after farming.
dataset = "eshed2010-lesions"
title = "Paleopathology and the origin of agriculture in the Levant: inflammatory (infectious) lesions of the postcranial skeleton"
version = "American Journal of Physical Anthropology 143(1), 2010"
homepage = "https://doi.org/10.1002/ajpa.21301"
citation = "Eshed, V., Gopher, A., Pinhasi, R., Hershkovitz, I. (2010). Paleopathology and the origin of agriculture in the Levant. American Journal of Physical Anthropology 143: 121-133. https://doi.org/10.1002/ajpa.21301"
doi = "10.1002/ajpa.21301"
notes = """
200 Natufian (10,500-8,300 BC) and 205 Neolithic (Pre-Pottery Neolithic B and C,
8,300-5,500 BC) skeletons from 13 sites, examined by one observer (Table 1). An
individual is affected by an infection/periosteal reaction if a discrete patch of
periosteal reaction covers more than a quarter of its tibia or a long bone, or a systemic
infection marks its skeleton (p. 126, "Infection/periosteal reactions"); active and healed
lesions are not told apart. Affected: 2 of 200 Natufians (1%) and 9 of 205 Neolithic
people (4.39%; one-tailed Fisher's exact P = 0.033; Results, p. 126, and Fig. 2); by
sex, males 2.0% and 5.7%, females 0% and 9.7% (Fig. 3, 4). Sites are located from the
paper's map (Fig. 1) and their published coordinates, to within a few km; Et Tin, 5
Natufians, from the map alone (south-east of Jerusalem).
"""

