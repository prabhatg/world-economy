# Sickle blades as a share of all flint tools at dated site phases of the Fertile Crescent,
# about 12,000 to 5,000 cal BC: how far people harvested cereals.
dataset = "maeda2016-sickles"
title = "Narrowing the harvest: Increasing sickle investment and the rise of domesticated cereal agriculture in the Fertile Crescent: Supplementary Table S3"
version = "Quaternary Science Reviews 145: 226-237 (2016), supplementary data"
homepage = "https://doi.org/10.1016/j.quascirev.2016.05.032"
citation = "Maeda, O., Lucas, L., Silva, F., Tanno, K.-I., Fuller, D.Q. (2016). Narrowing the harvest: Increasing sickle investment and the rise of domesticated cereal agriculture in the Fertile Crescent. Quaternary Science Reviews 145: 226-237. https://doi.org/10.1016/j.quascirev.2016.05.032"
doi = "10.1016/j.quascirev.2016.05.032"
notes = """
A Word document in the article's supplementary data, fetched from the publisher's file
server and checked by SHA-256 (the same supplement as maeda2016-cereals). Table S3 gives
277 site phases by sickle-blade group and region: the phase's median age (cal BC), its
sickle blades as a percentage of all flint tools (a value, a range, or a word such as
"rare"), and the primary lithic source. Obsidian tools are not counted. No coordinates:
judged phases are located by their radiocarbon samples in p3k14c or published coordinates
(oikos_data.sickles.SITES). The primary studies are to be cited with the phases they give.
"""

