[coverage]
spatial = "Anatolia, with assemblages from the Levant, Upper Mesopotamia and the Zagros"
temporal = "about 50,000 to 4,700 BC; most from 9,000 to 5,500 BC"

[[variables]]
name = "lsi"
unit = "log10 ratio"
description = "Mean log size index of the assemblage's measured sheep (or goat) bones against a standard animal, with sd and count"

[[variables]]
name = "juvenile"
unit = "1"
description = "Share of the assemblage's sheep (or goat) that died juvenile, by epiphyseal fusion or teeth, with its count"
