# Sheep and goat body size and juvenile shares of dated faunal assemblages, Anatolia and
# its neighbours: when caprines became domestic and how they were culled.
dataset = "arbuckle2014-fauna"
title = "Data sharing reveals complexity in the westward spread of domestic animals across Neolithic Turkey: Supporting Information Tables S1, S3 and S4"
version = "PLoS ONE 9(6): e99845 (2014), supporting information"
homepage = "https://doi.org/10.1371/journal.pone.0099845"
citation = "Arbuckle, B.S., Kansa, S.W., Kansa, E., Orton, D., Çakırlar, C., Gourichon, L., Atici, L., Galik, A., Marciniak, A., Mulville, J., Buitenhuis, H., Carruthers, D., De Cupere, B., Demirergi, A., Frame, S., Helmer, D., Martin, L., Peters, J., Pöllath, N., Pawłowska, K., Russell, N., Twiss, K., Würtenberger, D. (2014). Data sharing reveals complexity in the westward spread of domestic animals across Neolithic Turkey. PLoS ONE 9(6): e99845. https://doi.org/10.1371/journal.pone.0099845"
doi = "10.1371/journal.pone.0099845"
notes = """
Word documents in the article's supporting information, fetched as Europe PMC's
supplement archive (built on request, so its bytes vary; each member is checked by
SHA-256). Table S1 lists the assemblages with their phases, region and dates in
thousands of years cal BC; Table S3 (Ovis) and Table S4 (Capra) give each measured
assemblage's mean log size index (LSI) with sd and count, and its juvenile share with
its count ('+' by teeth, '*' sheep and goat combined; otherwise by epiphyseal fusion).
The assemblages' full faunal databases are published in Open Context (Table S1 links).
The tables give no coordinates: sites are located by their radiocarbon samples in
p3k14c, or their published coordinates (oikos_data.fauna.SITES).
"""

