# Domestic animals among the mammal bones of Egypt's Neolithic assemblages: when herds
# reached Africa (#51).
dataset = "linseele2014-egypt"
title = "New archaeozoological data from the Fayum 'Neolithic' with a critical assessment of the evidence for early stock keeping in Egypt: Tables 1, 3 and 6"
version = "PLoS ONE 9(10): e108517 (2014)"
homepage = "https://doi.org/10.1371/journal.pone.0108517"
citation = "Linseele, V., Van Neer, W., Thys, S., Phillipps, R., Cappers, R., Wendrich, W., Holdaway, S. (2014). New archaeozoological data from the Fayum 'Neolithic' with a critical assessment of the evidence for early stock keeping in Egypt. PLoS ONE 9(10): e108517. https://doi.org/10.1371/journal.pone.0108517"
doi = "10.1371/journal.pone.0108517"
notes = """
Transcribed from the article's tables; nothing is downloaded. Table 6 gives, for the
Egyptian Neolithic and early Predynastic assemblages, the domestic share of the mammal
bones (domestic animals against hunted mammals, carnivores and fish left out) and how
many there are; Table 3 gives the Fayum's assemblages as shares of all their identified
bones, domestic animals and wild mammals among them, so their mammals are the two
summed (fish, birds, reptiles and turtles left out). Bones identified only as small or
large bovid are counted with the species in the proportions of those identified (both
tables' remarks). Domestic bones are the share times the count, rounded.

Kept: assemblages in the M1 region (cell centers north of 24 N), dated to the 6th or 5th
millennium BC. Dates are the text's (Results, 'Evidence for early stock keeping in other
parts of Egypt'), else the table's phase (2: about the 6th millennium BC, 3: about the
5th). The Qasr el-Sagha dates are Table 1's radiocarbon ages calibrated with IntCal20
(6480 +/- 170 BP: 5600-5200 BC; 6380 +/- 60 BP: 5450-5250 BC; 5650 +/- 70 BP:
4600-4350 BC), as the text dates the oldest Fayum domesticates to 5400 BC. Merimde's
levels II-V (4600-4100 BC) are one assemblage. Kom K's share is the one without small
bovid teeth (9.8%, against 23.1% with them). Left out: the Tree Shelter (Table 6 puts it
in phase 2, the text dates it to 4300 and 3700 BC), the sites of Riemer's surveys
(Regenfeld, Chufu, Mudpans, Glass Area, Westpans: no domestic animals but in Glass Area,
undated within the Early and Middle Holocene and not located in the article), and the
Nabta Playa-Bir Kiseiba and Wadi Bakht assemblages, south of the region.

Sites are located by their radiocarbon samples in p3k14c (the M1 radiocarbon record),
except Hidden Valley, placed from its description (northern Farafra, by the Farafra-Ain
Dalla road, about 20 km east of the Sheikh el-Obeiyid sites) to within about 20 km, and
Maghar Dendera 2, at Dendera.

The article's own reading: no domesticates in Egypt before the 6th millennium BC but
Nabta Playa's disputed cattle; sheep and goats among mobile groups in the deserts and
the Fayum in the 6th, a handful of bones at most sites; crops and pigs from the
Southwest Asian Neolithic, with herds in numbers, in the Nile valley and the Fayum in the
5th. No cultivated crops are known in Egypt in the 6th millennium BC.
"""

